services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trip_route_calc}
      POSTGRES_USER: ${POSTGRES_USER:-trip_route_calc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trip_route_calc} -d ${POSTGRES_DB:-trip_route_calc}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - trip-route-calc-postgres:/var/lib/postgresql

volumes:
  trip-route-calc-postgres:
