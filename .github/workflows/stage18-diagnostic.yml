name: Stage 18 Diagnostic

on:
  push:
    branches:
      - agent/stage-18-mobile-trip-setup
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Capture lint output
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint:source > stage18-lint.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: stage18-lint-diagnostics
          path: stage18-lint.txt
          if-no-files-found: error
      - name: Fail when lint failed
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1
