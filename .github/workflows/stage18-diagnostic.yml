name: Stage 18 Diagnostic
on:
  push:
    branches: [agent/stage-18-mobile-trip-setup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-diagnostic:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Capture lint
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint:source > stage18-lint.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage18-lint-diagnostics
          path: stage18-lint.txt
      - if: steps.lint.outputs.exit_code != '0'
        run: exit 1
