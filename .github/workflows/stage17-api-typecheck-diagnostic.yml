name: Stage 17 API typecheck diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test

jobs:
  diagnose-api-typecheck:
    if: github.head_ref == 'agent/stage-17-rest-api-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Capture API typecheck report
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck:source > stage17-api-typecheck.log 2>&1
      - name: Upload API typecheck report
        uses: actions/upload-artifact@v4
        with:
          name: stage17-api-typecheck
          path: stage17-api-typecheck.log
          retention-days: 1
      - name: Preserve typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
