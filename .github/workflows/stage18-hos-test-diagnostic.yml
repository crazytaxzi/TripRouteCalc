name: Stage 18 HOS Test Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-diagnostic:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Capture tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test:source > stage18-hos-tests.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage18-hos-test-diagnostics
          path: stage18-hos-tests.txt
      - if: steps.tests.outputs.exit_code != '0'
        run: exit 1
