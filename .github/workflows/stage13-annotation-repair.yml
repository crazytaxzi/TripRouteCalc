name: Stage 13 Annotation Repair

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/stage13-annotation-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-13-california-kpra-axle
          fetch-depth: 0
      - name: Add explicit fixture return types
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one match for {old!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'packages/foundation/test/kpra.test.ts',
              "} from '../src/index.js';",
              "  type KpraAdjustmentAction,\n} from '../src/index.js';",
          )
          replace_once(
              'packages/foundation/test/kpra.test.ts',
              'function action() {',
              'function action(): KpraAdjustmentAction {',
          )
          replace_once(
              'packages/compliance/test/kpra-workflow.test.ts',
              "import { validateJurisdictionRule } from '@trip-route-calc/foundation/regulatory';",
              "import { validateJurisdictionRule } from '@trip-route-calc/foundation/regulatory';\nimport type {\n  JurisdictionRule,\n  RegulatoryEvaluationInput,\n} from '@trip-route-calc/foundation/regulatory';",
          )
          replace_once(
              'packages/compliance/test/kpra-workflow.test.ts',
              'function axleRule(maximumDriveWeight: number) {',
              'function axleRule(maximumDriveWeight: number): JurisdictionRule {',
          )
          replace_once(
              'packages/compliance/test/kpra-workflow.test.ts',
              "function excessiveInput(rules = [kpraRule('CA-KPRA-40', 40)]) {",
              "function excessiveInput(\n  rules = [kpraRule('CA-KPRA-40', 40)],\n): RegulatoryEvaluationInput {",
          )
          replace_once(
              'packages/persistence/test/kpra-adjustment.integration.test.ts',
              "} from '@trip-route-calc/foundation';",
              "  type KpraAdjustmentAction,\n  type KpraAdjustmentEvidence,\n} from '@trip-route-calc/foundation';",
          )
          replace_once(
              'packages/persistence/test/kpra-adjustment.integration.test.ts',
              'function action(originalTripRevisionId: string) {',
              'function action(originalTripRevisionId: string): KpraAdjustmentAction {',
          )
          replace_once(
              'packages/persistence/test/kpra-adjustment.integration.test.ts',
              ') {\n  const actionValue = action(originalTripRevisionId);',
              '): KpraAdjustmentEvidence {\n  const actionValue = action(originalTripRevisionId);',
          )
          PY
      - name: Commit repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages
          git commit -m 'Add Stage 13 fixture return annotations'
          git push origin HEAD:agent/stage-13-california-kpra-axle
