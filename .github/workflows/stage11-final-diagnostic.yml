name: Stage 11 Final Lint Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Capture generated lint findings
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile > stage11-final-lint-generated.txt 2>&1
          pnpm db:generate >> stage11-final-lint-generated.txt 2>&1
          pnpm lint:source >> stage11-final-lint-generated.txt 2>&1
          exit 0

      - name: Upload generated lint findings
        uses: actions/upload-artifact@v4
        with:
          name: stage11-final-lint-generated
          path: stage11-final-lint-generated.txt
          if-no-files-found: error
