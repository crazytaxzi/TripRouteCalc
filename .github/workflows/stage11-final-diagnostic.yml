name: Stage 11 Final Lint Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply final lint corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          service_path = Path('packages/routing/src/commercial-routing-service.ts')
          service = service_path.read_text()
          service = re.sub(
              r"if \(\n\s*config\.license === undefined \|\|\n\s*!config\.license\.commercialVehicleRoutingLicensed\n\s*\) \{",
              "if (!config.license?.commercialVehicleRoutingLicensed) {",
              service,
              count=1,
          )
          service = service.replace(
              "config.provider?.metadata.credentialRequirement === 'required'",
              "config.provider.metadata.credentialRequirement === 'required'",
              1,
          )
          service_path.write_text(service)

          test_path = Path('packages/routing/test/commercial-routing-service.test.ts')
          test = test_path.read_text()
          replacements = (
              ("geocodeLocation: async () => location('geocoded'),", "geocodeLocation: () => Promise.resolve(location('geocoded')),"),
              ("getRouteRestrictions: async () => [],", "getRouteRestrictions: () => Promise.resolve([]),"),
              ("calculateConsumerComparison: async () => routePayload('consumer-comparison'),", "calculateConsumerComparison: () => Promise.resolve(routePayload('consumer-comparison')),"),
              ("const sleep = vi.fn(async (): Promise<void> => undefined);", "const sleep = vi.fn((): Promise<void> => Promise.resolve());"),
              ("const fixture = provider(async () => {", "const fixture = provider(() => {"),
              ("      return routePayload();", "      return Promise.resolve(routePayload());"),
              ("const fixture = provider(async () => new Promise<never>(() => undefined));", "const fixture = provider(() => new Promise<never>(() => undefined));"),
              ("const fixture = provider(async () => routePayload('consumer-comparison'));", "const fixture = provider(() => Promise.resolve(routePayload('consumer-comparison')));"),
              ("sleep: async (): Promise<void> => undefined,", "sleep: (): Promise<void> => Promise.resolve(),"),
              ("const fixture = provider(async () => routePayload());", "const fixture = provider(() => Promise.resolve(routePayload()));"),
          )
          for before, after in replacements:
              test = test.replace(before, after)
          test_path.write_text(test)

          Path('.github/workflows/stage11-final-diagnostic.yml').unlink()
          Path('docs/implementation/.stage11-diagnostic-trigger').unlink(missing_ok=True)
          PY

      - name: Commit final lint corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix final Stage 11 lint findings"
          git push origin HEAD:agent/stage-11-commercial-routing-provider
