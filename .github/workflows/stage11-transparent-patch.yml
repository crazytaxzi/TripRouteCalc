name: Stage 11 Workspace Lock Patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Add routing workspace lock importer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          text = path.read_text()
          if '\n  packages/routing:\n' not in text:
              marker = '\npackages:\n'
              if text.count(marker) != 1:
                  raise SystemExit('Expected one top-level packages marker in pnpm-lock.yaml.')
              importer = """
  packages/routing:
    dependencies:
      '@trip-route-calc/foundation':
        specifier: workspace:*
        version: link:../foundation
"""
              text = text.replace(marker, importer + marker)
              path.write_text(text)
          Path('.github/workflows/stage11-transparent-patch.yml').unlink()
          PY

      - name: Commit workspace lock patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Stage 11 routing workspace lock"
          git push origin HEAD:agent/stage-11-commercial-routing-provider
