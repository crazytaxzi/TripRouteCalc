name: Stage 09 Final Type Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply branded UTC integration fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/persistence/test/equipment-profile.integration.test.ts')
          text = path.read_text()
          old = "  speedInMilesPerHour,\n  volumeInUsGallons,"
          new = "  speedInMilesPerHour,\n  utcInstant,\n  volumeInUsGallons,"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "verifiedAt: '2026-07-20T12:00:00.000Z',"
          new = "verifiedAt: utcInstant('2026-07-20T12:00:00.000Z'),"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          rm -rf .stage09-diagnostics
          rm -f .github/workflows/stage09-final-type-fix.yml
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Brand Stage 09 integration UTC fixture"
          git push origin HEAD:agent/stage-09-equipment-load-validation
