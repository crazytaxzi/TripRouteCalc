name: Stage 17 API lint diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-api-lint:
    if: github.head_ref == 'agent/stage-17-rest-api-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture API lint report
        id: lint
        continue-on-error: true
        run: pnpm exec eslint packages/api --max-warnings=0 > stage17-api-lint.log 2>&1
      - name: Upload API lint report
        uses: actions/upload-artifact@v4
        with:
          name: stage17-api-lint
          path: stage17-api-lint.log
          retention-days: 1
      - name: Preserve lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1
