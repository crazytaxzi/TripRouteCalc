name: Stage 17 runtime diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test

jobs:
  diagnose-runtime:
    if: github.head_ref == 'agent/stage-17-rest-api-validation'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - name: Capture full runtime suite
        id: tests
        continue-on-error: true
        run: pnpm test:source > stage17-runtime.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: stage17-runtime
          path: stage17-runtime.log
          retention-days: 1
      - if: steps.tests.outcome == 'failure'
        run: exit 1
