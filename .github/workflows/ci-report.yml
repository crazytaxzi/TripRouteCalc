name: CI Report

on:
  push:
    branches: ['agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Capture checks
        shell: bash
        run: |
          mkdir -p reports
          set +e
          pnpm lint > reports/lint.log 2>&1
          echo "$?" > reports/lint.exit
          pnpm typecheck > reports/typecheck.log 2>&1
          echo "$?" > reports/typecheck.exit
          pnpm test > reports/test.log 2>&1
          echo "$?" > reports/test.exit
          pnpm build > reports/build.log 2>&1
          echo "$?" > reports/build.exit
          cp pnpm-lock.yaml reports/pnpm-lock.yaml
          exit 0

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-check-reports
          path: reports/
          if-no-files-found: error
