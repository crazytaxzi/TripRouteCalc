name: Stage 13 Test Evidence

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/stage13-test-evidence.yml]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-13-california-kpra-axle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Capture complete test evidence
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile > stage13-tests.txt 2>&1
          pnpm db:generate >> stage13-tests.txt 2>&1
          pnpm db:migrate:deploy >> stage13-tests.txt 2>&1
          pnpm test:source >> stage13-tests.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: stage13-tests
          path: stage13-tests.txt
