name: Stage 09 Typecheck Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply verified type corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          foundation = Path('packages/foundation/test/equipment.test.ts')
          text = foundation.read_text()
          old = "  volumeInUsGallons,\n  weightInPounds,"
          new = "  utcInstant,\n  volumeInUsGallons,\n  weightInPounds,"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "function evidence(...fieldPaths: string[]): readonly EquipmentFieldEvidence[] {"
          new = "function evidence(...fieldPaths: string[]): EquipmentFieldEvidence[] {"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "verifiedAt: '2026-07-20T12:00:00.000Z',"
          new = "verifiedAt: utcInstant('2026-07-20T12:00:00.000Z'),"
          assert text.count(old) == 1
          foundation.write_text(text)

          repository = Path('packages/persistence/src/equipment-profile-repository.ts')
          text = repository.read_text()
          old = 'explanation: mapping.explanation,'
          new = 'explanation: mapping.explanation ?? null,'
          assert text.count(old) == 2
          repository.write_text(text.replace(old, new))

          integration = Path('packages/persistence/test/equipment-profile.integration.test.ts')
          text = integration.read_text()
          old = "} from '@trip-route-calc/foundation';\nimport { afterAll"
          new = "} from '@trip-route-calc/foundation';\nimport type {\n  LoadProfile,\n  TractorProfile,\n  TrailerProfile,\n} from '@trip-route-calc/foundation';\nimport { afterAll"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "import type {\n  LoadProfile,\n  PersistenceClient,\n  TenantContext,\n  TractorProfile,\n  TrailerProfile,\n} from '../src/index.js';"
          new = "import type { PersistenceClient, TenantContext } from '../src/index.js';"
          assert text.count(old) == 1
          integration.write_text(text.replace(old, new))
          PY
          rm -rf .stage09-diagnostics
          rm -f .github/workflows/stage09-typecheck-fix.yml
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Stage 09 strict type errors"
          git push origin HEAD:agent/stage-09-equipment-load-validation
