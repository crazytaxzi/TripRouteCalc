name: Stage 10 Full Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Prepare repository
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm db:validate
          pnpm db:migrate:deploy

      - name: Capture all remaining findings
        shell: bash
        run: |
          set +e
          pnpm lint:source > /tmp/lint.txt 2>&1
          echo $? > /tmp/lint.exit
          pnpm typecheck:source > /tmp/typecheck.txt 2>&1
          echo $? > /tmp/typecheck.exit
          pnpm test:source > /tmp/test.txt 2>&1
          echo $? > /tmp/test.exit
          pnpm build:source > /tmp/build.txt 2>&1
          echo $? > /tmp/build.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: stage10-full-diagnostics
          path: |
            /tmp/lint.txt
            /tmp/lint.exit
            /tmp/typecheck.txt
            /tmp/typecheck.exit
            /tmp/test.txt
            /tmp/test.exit
            /tmp/build.txt
            /tmp/build.exit
          if-no-files-found: error
