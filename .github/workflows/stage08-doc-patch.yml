name: Stage 08 documentation patch

on:
  push:
    branches:
      - agent/stage-08-hos-automated-tests

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Stage 08 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-08-hos-automated-tests
      - name: Patch Stage 08 ledgers and maps
        shell: python
        run: |
          from pathlib import Path

          decisions = Path('docs/implementation/DECISIONS.md')
          text = decisions.read_text()
          section = """

          ## D-034: Treat the Stage 08 suite as acceptance evidence, not a second implementation

          **Status:** Accepted

          The Stage 08 master scenarios, exact-boundary tables, deterministic replay, pure-engine isolation checks, and persistence mapping tests exercise the accepted Stage 04 through Stage 07 contracts. Tests may expose a production defect, but they may not redefine verified legal behavior merely to obtain a passing result. Reusable fixtures remain test-only evidence builders and cannot become production defaults or provider fallbacks.
          """
          if '## D-034:' not in text:
              decisions.write_text(text.rstrip() + section + '\n')

          blockers = Path('docs/implementation/BLOCKERS.md')
          text = blockers.read_text()
          section = """

          ## Stage 08 blocker review

          **Status:** No active Stage 08 blocker

          Stage 08 required accepted HOS contracts and engines, a clean PostgreSQL integration target, and the existing strict repository gates. Those inputs were sufficient to add and verify the complete master-scenario, boundary, replay, isolation, timezone, and persistence-mapping suite. No provider credential, regulatory feed, production deployment, schema migration, or new legal interpretation was required.

          The expanded suite exposed no verified production HOS defect. Commercial routing, production regulatory data, and deployment remain visible future blockers and were not replaced with mocks or approximations.
          """
          if '## Stage 08 blocker review' not in text:
              blockers.write_text(text.rstrip() + section + '\n')

          hos_readme = Path('docs/hos/README.md')
          text = hos_readme.read_text()
          section = """

          ## Stage 08 acceptance suite

          Stage 08 adds stable `HOS-01` through `HOS-15` master acceptance scenarios, exact-boundary tables, malformed-sequence rejection, deterministic replay, UTC and display-zone equivalence, pure-engine dependency isolation, and PostgreSQL persistence mapping across a repeated local hour.

          Fixture facts and legal assumptions are documented in `docs/hos/test-fixtures.md`. These helpers are test-only evidence builders and are never production defaults, legal data, or route-provider fallbacks.
          """
          if '## Stage 08 acceptance suite' not in text:
              hos_readme.write_text(text.rstrip() + section + '\n')

          architecture = Path('docs/implementation/ARCHITECTURE_MAP.md')
          text = architecture.read_text()
          replacements = [
              (
                  """│   ├── hos/
          │   │   └── README.md
          """,
                  """│   ├── hos/
          │   │   ├── README.md
          │   │   └── test-fixtures.md
          """,
              ),
              (
                  """│           └── 07-hos-sleeper-adverse-and-carrier-policy.md
          """,
                  """│           ├── 07-hos-sleeper-adverse-and-carrier-policy.md
          │           └── 08-hos-automated-test-suite.md
          """,
              ),
              (
                  """    │       ├── hos-advanced.test.ts
          """,
                  """    │       ├── hos-acceptance.test.ts
          │       ├── hos-advanced.test.ts
          │       ├── hos-engine-isolation.test.ts
          │       ├── hos-test-fixtures.ts
          """,
              ),
              (
                  """            ├── driver-hos.integration.test.ts
          """,
                  """            ├── driver-hos.integration.test.ts
          │           ├── hos-domain-mapping.integration.test.ts
          """,
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          marker = '- Pure Stage 07 advanced HOS composition with explicit sleeper-pair validation, adverse-driving-condition selection, carrier caps, preferred-rest conflicts, and unsupported-rule warnings\n'
          addition = '- Stage 08 master-scenario, boundary, deterministic-replay, pure-engine-isolation, and PostgreSQL HOS mapping acceptance coverage\n'
          if addition not in text and marker in text:
              text = text.replace(marker, marker + addition)
          architecture.write_text(text)
      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/stage08-doc-patch.yml
      - name: Commit Stage 08 ledger patches
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Complete Stage 08 implementation ledgers"
          git push origin HEAD:agent/stage-08-hos-automated-tests
