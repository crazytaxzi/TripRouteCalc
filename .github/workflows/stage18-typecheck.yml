name: Stage 18 Typecheck Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Capture type-check
        id: check
        shell: bash
        run: |
          set +e
          pnpm typecheck:source > stage18-typecheck.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage18-typecheck-diagnostics
          path: stage18-typecheck.txt
      - if: steps.check.outputs.exit_code != '0'
        run: exit 1
