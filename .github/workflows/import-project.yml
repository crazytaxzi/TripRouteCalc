name: Import TripRouteCalc project

on:
  push:
    paths:
      - .github/workflows/import-project.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import/chunk-*.b64 > /tmp/triproutecalc-project.b64
          base64 --decode /tmp/triproutecalc-project.b64 > /tmp/triproutecalc-project.tar.gz
          actual_sha="$(sha256sum /tmp/triproutecalc-project.tar.gz | awk '{print $1}')"
          expected_sha="8aaf7a37c93e5bafa66510efbc08e05bc2c4ab25346f33c6175507b8552c7a5c"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "Archive checksum mismatch: expected $expected_sha, got $actual_sha"
            exit 1
          fi
          tar -xzf /tmp/triproutecalc-project.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf "$GITHUB_WORKSPACE/.github/import"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Project files already match the archive."
            exit 0
          fi
          git commit -m "Import TripRouteCalc specifications and Stage 01 ledger"
          git push origin HEAD:main
