name: Stage 18 lint diagnostic

on:
  push:
    branches: ['agent/stage-18-mobile-trip-setup']

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - name: Capture lint output
        run: pnpm lint:source > lint-output.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: stage18-lint-output
          path: lint-output.txt
