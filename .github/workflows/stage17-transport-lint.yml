name: Stage 17 transport lint diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test

jobs:
  diagnose-transport-lint:
    if: github.head_ref == 'agent/stage-17-rest-api-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Capture lint
        id: lint
        continue-on-error: true
        run: pnpm exec eslint packages/api packages/persistence/src/api-idempotency-repository.ts packages/persistence/test/api-idempotency.integration.test.ts --max-warnings=0 > stage17-transport-lint.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: stage17-transport-lint
          path: stage17-transport-lint.log
          retention-days: 1
      - if: steps.lint.outcome == 'failure'
        run: exit 1
