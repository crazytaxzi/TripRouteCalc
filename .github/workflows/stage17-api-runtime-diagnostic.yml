name: Stage 17 API parameter-limit repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-parameter-limit:
    if: github.head_ref == 'agent/stage-17-rest-api-validation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-17-rest-api-validation
          fetch-depth: 0
      - name: Raise encrypted identifier parameter ceiling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/api/src/server.ts')
          text = path.read_text()
          old = "    logger: dependencies.logger ?? false,\n    ajv: { customOptions: { removeAdditional: false } },\n"
          new = "    logger: dependencies.logger ?? false,\n    routerOptions: { maxParamLength: 512 },\n    ajv: { customOptions: { removeAdditional: false } },\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected Fastify options block once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/stage17-api-runtime-diagnostic.yml').unlink()
          PY
      - name: Commit parameter-limit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/src/server.ts .github/workflows/stage17-api-runtime-diagnostic.yml
          git commit -m 'Support encrypted public IDs in Fastify routes'
          git push origin HEAD:agent/stage-17-rest-api-validation
