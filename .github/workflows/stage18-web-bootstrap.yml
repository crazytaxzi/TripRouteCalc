name: Stage 18 web preflight and lock refresh

on:
  push:
    branches:
      - agent/stage-18-mobile-trip-setup-ui

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-18-mobile-trip-setup-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Apply bounded web preflight repairs
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1))

          types_path = Path('packages/web/src/types.ts')
          types_text = types_path.read_text()
          expected = types_text.count('readonly id?: string;')
          if expected != 4:
              raise RuntimeError(f'types.ts: expected four optional profile ids, found {expected}')
          types_path.write_text(
              types_text.replace('readonly id?: string;', 'readonly id?: string | undefined;')
          )

          replace_once(
              'packages/web/src/model.ts',
              "    route: {\n      policy: 'fastest-compliant',",
              "    route: {\n      ruleSetVersion: '',\n      policy: 'fastest-compliant',",
          )
          replace_once(
              'packages/web/src/model.ts',
              "  if (draft.load.commodityDescription.trim() === '') {\n    issues.push({ severity: 'error', path: 'load.commodityDescription', message: 'Describe the commodity.' });\n  }\n",
              "  if (draft.load.commodityDescription.trim() === '') {\n    issues.push({ severity: 'error', path: 'load.commodityDescription', message: 'Describe the commodity.' });\n  }\n  if (draft.route.ruleSetVersion.trim() === '') {\n    issues.push({\n      severity: 'error',\n      path: 'route.ruleSetVersion',\n      message: 'Enter the reviewed regulatory rule-set version.',\n    });\n  }\n",
          )

          replace_once(
              'packages/web/src/api-client.ts',
              "      const { id: _id, sequence: _sequence, ...stop } = plan;\n",
              "      const stop = Object.fromEntries(\n        Object.entries(plan).filter(\n          ([key]) => key !== 'id' && key !== 'sequence',\n        ),\n      );\n",
          )
          replace_once(
              'packages/web/src/api-client.ts',
              "      publicStops = publicStopsFromTrip(updatedTrip, savedDraft.stops);\n",
              "      const persisted = publicStopsFromTrip(\n        updatedTrip,\n        savedDraft.stops.slice(0, index + 1),\n      );\n      publicStops = [\n        ...persisted,\n        ...savedDraft.stops.slice(index + 1),\n      ];\n",
          )
          replace_once(
              'packages/web/src/api-client.ts',
              "    const rawRoute = object(routeResponse.route, 'route');\n    const { assessment: _assessment, ...routePayload } = rawRoute;\n    const route = assessCommercialRoute(routePayload);\n",
              "    const routePayload = { ...object(routeResponse.route, 'route') };\n    delete routePayload.assessment;\n    const route = assessCommercialRoute(routePayload);\n",
          )
          replace_once(
              'packages/web/src/api-client.ts',
              "        confidence:\n          typeof expected.confidence === 'string' ? expected.confidence : undefined,\n        warnings: explanations,\n",
              "        ...(typeof expected.confidence === 'string'\n          ? { confidence: expected.confidence }\n          : {}),\n        warnings: explanations,\n",
          )

          replace_once(
              'packages/web/e2e/planner.spec.ts',
              "import { expect, test } from '@playwright/test';\n\nasync function mockProfiles(page: Parameters<typeof test>[0]['page']): Promise<void> {\n",
              "import { expect, test } from '@playwright/test';\nimport type { Page } from '@playwright/test';\n\nasync function mockProfiles(page: Page): Promise<void> {\n",
          )

          replace_once(
              'packages/web/src/model.test.ts',
              "    const attemptedLockedMove = draftReducer(moved, {\n      type: 'move-stop',\n      localId: moved.stops[0]!.localId,\n      direction: 1,\n    });\n",
              "    const lockedStart = moved.stops[0];\n    if (lockedStart === undefined) throw new Error('Missing locked start stop.');\n    const attemptedLockedMove = draftReducer(moved, {\n      type: 'move-stop',\n      localId: lockedStart.localId,\n      direction: 1,\n    });\n",
          )
          PY
      - name: Refresh frozen lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit preflight and lockfile
        run: |
          rm .github/workflows/stage18-web-bootstrap.yml
          git config user.name "TripRouteCalc Stage 18 Agent"
          git config user.email "actions@users.noreply.github.com"
          git add packages/web pnpm-lock.yaml .github/workflows/stage18-web-bootstrap.yml
          git commit -m "build(stage18): refresh web lockfile and preflight"
          git push origin HEAD:agent/stage-18-mobile-trip-setup-ui
