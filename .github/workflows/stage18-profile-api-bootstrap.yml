name: Stage 18 profile API bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap-profile-api:
    if: github.head_ref == 'agent/stage-18-mobile-trip-setup-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-18-mobile-trip-setup-ui
          fetch-depth: 0
      - name: Apply bounded profile API extension
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1))

          contracts = 'packages/api/src/contracts.ts'
          replace_once(
              contracts,
              "export const TripStopPathSchema = z\n  .object({ tripId: publicIdentifier, stopId: publicIdentifier })\n  .strict();\n",
              "export const TripStopPathSchema = z\n  .object({ tripId: publicIdentifier, stopId: publicIdentifier })\n  .strict();\nexport const DriverPathSchema = z\n  .object({ driverId: publicIdentifier })\n  .strict();\nexport const TractorPathSchema = z\n  .object({ tractorId: publicIdentifier })\n  .strict();\nexport const TrailerPathSchema = z\n  .object({ trailerId: publicIdentifier })\n  .strict();\nexport const LoadPathSchema = z\n  .object({ loadId: publicIdentifier })\n  .strict();\n",
          )

          application = 'packages/api/src/application.ts'
          replace_once(
              application,
              "  public async createTrip(\n",
              "  public async listDrivers(\n    principal: AuthenticatedPrincipal,\n  ): Promise<ApplicationOperationResult> {\n    const context = tenantContext(principal);\n    await assertTenantMembership(this.#client, context);\n    const drivers = await this.#client.driver.findMany({\n      where: { carrierId: context.carrierId },\n      orderBy: [{ displayName: 'asc' }, { createdAt: 'asc' }],\n    });\n    return {\n      statusCode: 200,\n      body: snapshotObject({\n        drivers: drivers.map((driver) => ({\n          driverId: this.#publicIds.encode('driver', driver.id),\n          displayName: driver.displayName,\n          createdAt: driver.createdAt.toISOString(),\n          updatedAt: driver.updatedAt.toISOString(),\n        })),\n      }),\n    };\n  }\n\n  public async updateDriver(\n    principal: AuthenticatedPrincipal,\n    publicDriverId: string,\n    body: CreateDriverBody,\n    idempotencyKey: string,\n  ): Promise<ApplicationOperationResult> {\n    const context = tenantContext(principal);\n    const driverId = this.#publicIds.decode(publicDriverId, 'driver');\n    return this.#idempotent(\n      context,\n      'driver.update',\n      idempotencyKey,\n      { driverId: publicDriverId, ...body },\n      async (): Promise<ApplicationOperationResult> => {\n        await assertTenantMembership(this.#client, context);\n        const existing = await this.#client.driver.findFirst({\n          where: { id: driverId, carrierId: context.carrierId },\n          select: { id: true },\n        });\n        if (existing === null) {\n          throw new ApiError(\n            404,\n            'RESOURCE_NOT_FOUND',\n            'Driver was not found in the authenticated carrier account.',\n          );\n        }\n        const driver = await this.#client.driver.update({\n          where: { id: driverId },\n          data: { displayName: body.displayName },\n        });\n        await this.#client.auditEvent.create({\n          data: {\n            carrierId: context.carrierId,\n            actorUserId: context.actorUserId,\n            entityType: 'driver',\n            entityId: driver.id,\n            action: 'update',\n            metadata: { displayName: driver.displayName },\n          },\n        });\n        return {\n          statusCode: 200,\n          body: snapshotObject({\n            driverId: this.#publicIds.encode('driver', driver.id),\n            displayName: driver.displayName,\n            createdAt: driver.createdAt.toISOString(),\n            updatedAt: driver.updatedAt.toISOString(),\n          }),\n        };\n      },\n    );\n  }\n\n  public async createTrip(\n",
          )
          replace_once(
              application,
              "  public async validateRoute(\n",
              "  public async listTractors(\n    principal: AuthenticatedPrincipal,\n  ): Promise<ApplicationOperationResult> {\n    return this.#listEquipment(tenantContext(principal), 'tractor');\n  }\n\n  public async updateTractor(\n    principal: AuthenticatedPrincipal,\n    publicTractorId: string,\n    profile: unknown,\n    idempotencyKey: string,\n  ): Promise<ApplicationOperationResult> {\n    return this.#updateEquipment(\n      tenantContext(principal),\n      'tractor',\n      publicTractorId,\n      profile,\n      idempotencyKey,\n    );\n  }\n\n  public async listTrailers(\n    principal: AuthenticatedPrincipal,\n  ): Promise<ApplicationOperationResult> {\n    return this.#listEquipment(tenantContext(principal), 'trailer');\n  }\n\n  public async updateTrailer(\n    principal: AuthenticatedPrincipal,\n    publicTrailerId: string,\n    profile: unknown,\n    idempotencyKey: string,\n  ): Promise<ApplicationOperationResult> {\n    return this.#updateEquipment(\n      tenantContext(principal),\n      'trailer',\n      publicTrailerId,\n      profile,\n      idempotencyKey,\n    );\n  }\n\n  public async listLoads(\n    principal: AuthenticatedPrincipal,\n  ): Promise<ApplicationOperationResult> {\n    return this.#listEquipment(tenantContext(principal), 'load');\n  }\n\n  public async updateLoad(\n    principal: AuthenticatedPrincipal,\n    publicLoadId: string,\n    profile: unknown,\n    idempotencyKey: string,\n  ): Promise<ApplicationOperationResult> {\n    return this.#updateEquipment(\n      tenantContext(principal),\n      'load',\n      publicLoadId,\n      profile,\n      idempotencyKey,\n    );\n  }\n\n  public async validateRoute(\n",
          )
          replace_once(
              application,
              "  async #createEquipment(\n",
              "  async #listEquipment(\n    context: TenantContext,\n    kind: 'tractor' | 'trailer' | 'load',\n  ): Promise<ApplicationOperationResult> {\n    const repository = new EquipmentProfileRepository(this.#client, context);\n    const persisted =\n      kind === 'tractor'\n        ? await repository.listTractors()\n        : kind === 'trailer'\n          ? await repository.listTrailers()\n          : await repository.listLoads();\n    const collection =\n      kind === 'tractor' ? 'tractors' : kind === 'trailer' ? 'trailers' : 'loads';\n    return {\n      statusCode: 200,\n      body: snapshotObject({\n        [collection]: persisted.map((item) => ({\n          [`${kind}Id`]: this.#publicIds.encode(kind, item.id),\n          profile: item.profile,\n          createdAt: item.createdAt.toISOString(),\n          updatedAt: item.updatedAt.toISOString(),\n        })),\n      }),\n    };\n  }\n\n  async #updateEquipment(\n    context: TenantContext,\n    kind: 'tractor' | 'trailer' | 'load',\n    publicId: string,\n    profile: unknown,\n    idempotencyKey: string,\n  ): Promise<ApplicationOperationResult> {\n    const id = this.#publicIds.decode(publicId, kind);\n    return this.#idempotent(\n      context,\n      `equipment.${kind}.update`,\n      idempotencyKey,\n      { publicId, profile },\n      async (): Promise<ApplicationOperationResult> => {\n        const repository = new EquipmentProfileRepository(this.#client, context);\n        const persisted =\n          kind === 'tractor'\n            ? await repository.updateTractor(id, profile)\n            : kind === 'trailer'\n              ? await repository.updateTrailer(id, profile)\n              : await repository.updateLoad(id, profile);\n        return {\n          statusCode: 200,\n          body: snapshotObject({\n            [`${kind}Id`]: this.#publicIds.encode(kind, persisted.id),\n            profile: persisted.profile,\n            createdAt: persisted.createdAt.toISOString(),\n            updatedAt: persisted.updatedAt.toISOString(),\n          }),\n        };\n      },\n    );\n  }\n\n  async #createEquipment(\n",
          )

          server = 'packages/api/src/server.ts'
          replace_once(
              server,
              "  CalculateTripBodySchema,\n  CreateDriverBodySchema,\n",
              "  CalculateTripBodySchema,\n  CreateDriverBodySchema,\n  DriverPathSchema,\n",
          )
          replace_once(
              server,
              "  IdempotencyKeySchema,\n  PatchStopBodySchema,\n",
              "  IdempotencyKeySchema,\n  LoadPathSchema,\n  PatchStopBodySchema,\n",
          )
          replace_once(
              server,
              "  TripPathSchema,\n  TripStopPathSchema,\n",
              "  TractorPathSchema,\n  TrailerPathSchema,\n  TripPathSchema,\n  TripStopPathSchema,\n",
          )
          replace_once(
              server,
              "  app.post('/api/trips', async (request, reply) => {\n",
              "  app.get('/api/drivers', async (request, reply) => {\n    const principal = rateLimitedPrincipal(\n      request,\n      reply,\n      dependencies.authenticator,\n      dependencies.rateLimiter,\n    );\n    return sendOperation(reply, await dependencies.application.listDrivers(principal));\n  });\n\n  app.patch('/api/drivers/:driverId', async (request, reply) => {\n    const principal = rateLimitedPrincipal(\n      request,\n      reply,\n      dependencies.authenticator,\n      dependencies.rateLimiter,\n    );\n    const params = DriverPathSchema.parse(request.params);\n    return sendOperation(\n      reply,\n      await dependencies.application.updateDriver(\n        principal,\n        params.driverId,\n        CreateDriverBodySchema.parse(request.body),\n        idempotencyKey(request),\n      ),\n    );\n  });\n\n  app.post('/api/trips', async (request, reply) => {\n",
          )
          replace_once(
              server,
              "  app.post('/api/equipment/trailers', async (request, reply) => {\n",
              "  app.get('/api/equipment/tractors', async (request, reply) => {\n    const principal = rateLimitedPrincipal(\n      request, reply, dependencies.authenticator, dependencies.rateLimiter,\n    );\n    return sendOperation(reply, await dependencies.application.listTractors(principal));\n  });\n\n  app.patch('/api/equipment/tractors/:tractorId', async (request, reply) => {\n    const principal = rateLimitedPrincipal(\n      request, reply, dependencies.authenticator, dependencies.rateLimiter,\n    );\n    const params = TractorPathSchema.parse(request.params);\n    return sendOperation(\n      reply,\n      await dependencies.application.updateTractor(\n        principal, params.tractorId, CreateTractorBodySchema.parse(request.body),\n        idempotencyKey(request),\n      ),\n    );\n  });\n\n  app.post('/api/equipment/trailers', async (request, reply) => {\n",
          )
          replace_once(
              server,
              "  app.post('/api/equipment/loads', async (request, reply) => {\n",
              "  app.get('/api/equipment/trailers', async (request, reply) => {\n    const principal = rateLimitedPrincipal(\n      request, reply, dependencies.authenticator, dependencies.rateLimiter,\n    );\n    return sendOperation(reply, await dependencies.application.listTrailers(principal));\n  });\n\n  app.patch('/api/equipment/trailers/:trailerId', async (request, reply) => {\n    const principal = rateLimitedPrincipal(\n      request, reply, dependencies.authenticator, dependencies.rateLimiter,\n    );\n    const params = TrailerPathSchema.parse(request.params);\n    return sendOperation(\n      reply,\n      await dependencies.application.updateTrailer(\n        principal, params.trailerId, CreateTrailerBodySchema.parse(request.body),\n        idempotencyKey(request),\n      ),\n    );\n  });\n\n  app.post('/api/equipment/loads', async (request, reply) => {\n",
          )
          replace_once(
              server,
              "  app.post('/api/routes/validate', async (request, reply) => {\n",
              "  app.get('/api/equipment/loads', async (request, reply) => {\n    const principal = rateLimitedPrincipal(\n      request, reply, dependencies.authenticator, dependencies.rateLimiter,\n    );\n    return sendOperation(reply, await dependencies.application.listLoads(principal));\n  });\n\n  app.patch('/api/equipment/loads/:loadId', async (request, reply) => {\n    const principal = rateLimitedPrincipal(\n      request, reply, dependencies.authenticator, dependencies.rateLimiter,\n    );\n    const params = LoadPathSchema.parse(request.params);\n    return sendOperation(\n      reply,\n      await dependencies.application.updateLoad(\n        principal, params.loadId, CreateLoadBodySchema.parse(request.body),\n        idempotencyKey(request),\n      ),\n    );\n  });\n\n  app.post('/api/routes/validate', async (request, reply) => {\n",
          )

          openapi = 'packages/api/src/openapi.ts'
          replace_once(openapi, "version: '17.0.0'", "version: '18.0.0'")
          replace_once(
              openapi,
              "  const stopParameter = {\n    name: 'stopId',\n    in: 'path',\n    required: true,\n    schema: { type: 'string' },\n  };\n",
              "  const stopParameter = {\n    name: 'stopId',\n    in: 'path',\n    required: true,\n    schema: { type: 'string' },\n  };\n  const identifierParameter = (name: string): Readonly<Record<string, unknown>> => ({\n    name,\n    in: 'path',\n    required: true,\n    schema: { type: 'string' },\n  });\n",
          )
          replace_once(
              openapi,
              "      '/api/drivers': {\n        post: {\n",
              "      '/api/drivers': {\n        get: {\n          operationId: 'listDrivers',\n          security: authenticated,\n          responses: { '200': { description: 'Carrier driver profiles' }, '401': errorResponse },\n        },\n        post: {\n",
          )
          replace_once(
              openapi,
              "      '/api/equipment/tractors': {\n",
              "      '/api/drivers/{driverId}': {\n        patch: {\n          operationId: 'updateDriver',\n          security: authenticated,\n          parameters: [identifierParameter('driverId'), idempotencyHeader],\n          requestBody: jsonBody({ type: 'object' }),\n          responses: { '200': { description: 'Driver updated' }, '400': errorResponse, '401': errorResponse, '404': errorResponse, '409': errorResponse },\n        },\n      },\n      '/api/equipment/tractors': {\n        get: {\n          operationId: 'listTractors',\n          security: authenticated,\n          responses: { '200': { description: 'Carrier tractor profiles' }, '401': errorResponse },\n        },\n",
          )
          replace_once(
              openapi,
              "      '/api/equipment/trailers': {\n",
              "      '/api/equipment/tractors/{tractorId}': {\n        patch: {\n          operationId: 'updateTractor',\n          security: authenticated,\n          parameters: [identifierParameter('tractorId'), idempotencyHeader],\n          requestBody: jsonBody({ type: 'object' }),\n          responses: { '200': { description: 'Tractor updated' }, '400': errorResponse, '401': errorResponse, '404': errorResponse, '409': errorResponse },\n        },\n      },\n      '/api/equipment/trailers': {\n        get: {\n          operationId: 'listTrailers',\n          security: authenticated,\n          responses: { '200': { description: 'Carrier trailer profiles' }, '401': errorResponse },\n        },\n",
          )
          replace_once(
              openapi,
              "      '/api/equipment/loads': {\n",
              "      '/api/equipment/trailers/{trailerId}': {\n        patch: {\n          operationId: 'updateTrailer',\n          security: authenticated,\n          parameters: [identifierParameter('trailerId'), idempotencyHeader],\n          requestBody: jsonBody({ type: 'object' }),\n          responses: { '200': { description: 'Trailer updated' }, '400': errorResponse, '401': errorResponse, '404': errorResponse, '409': errorResponse },\n        },\n      },\n      '/api/equipment/loads': {\n        get: {\n          operationId: 'listLoads',\n          security: authenticated,\n          responses: { '200': { description: 'Carrier load profiles' }, '401': errorResponse },\n        },\n",
          )
          replace_once(
              openapi,
              "      '/api/routes/validate': {\n",
              "      '/api/equipment/loads/{loadId}': {\n        patch: {\n          operationId: 'updateLoad',\n          security: authenticated,\n          parameters: [identifierParameter('loadId'), idempotencyHeader],\n          requestBody: jsonBody({ type: 'object' }),\n          responses: { '200': { description: 'Load updated' }, '400': errorResponse, '401': errorResponse, '404': errorResponse, '409': errorResponse },\n        },\n      },\n      '/api/routes/validate': {\n",
          )

          test_path = Path('packages/api/test/server.integration.test.ts')
          test_text = test_path.read_text()
          marker = "\n});\n"
          if not test_text.endswith(marker):
              raise RuntimeError('server integration test did not end with expected describe closure')
          profile_test = r'''

  it('lists and edits reusable driver and equipment profiles with tenant isolation', async () => {
    const owner = await seedTenant('profiles-owner');
    const outsider = await seedTenant('profiles-outsider');
    const driverId = await createDriver(owner, 'Original');

    const drivers = await api.inject({
      method: 'GET',
      url: '/api/drivers',
      headers: headers(owner),
    });
    expect(drivers.statusCode).toBe(200);
    const driverRows = z.array(responseObjectSchema).parse(responseObject(drivers).drivers);
    expect(driverRows).toHaveLength(1);
    expect(nestedObject(driverRows[0], 'driver').displayName).toBe('Original Driver');

    const changedDriver = await api.inject({
      method: 'PATCH',
      url: `/api/drivers/${driverId}`,
      headers: headers(owner, `driver-update-${randomUUID()}`),
      payload: { displayName: 'Updated Driver' },
    });
    expect(changedDriver.statusCode).toBe(200);
    expect(responseObject(changedDriver).displayName).toBe('Updated Driver');

    const tractorProfile = {
      unitNumber: 'TR-180',
      tractorType: 'sleeper',
      axleCount: 3,
      hazmatEquipped: false,
      californiaCompliance: { status: 'not-evaluated' },
      idleAuxiliaryPower: {
        idleAllowed: false,
        auxiliaryPowerUnitAvailable: true,
      },
      fieldEvidence: [],
      extensionMetadata: {},
    };
    const createdTractor = await api.inject({
      method: 'POST',
      url: '/api/equipment/tractors',
      headers: headers(owner, `tractor-create-${randomUUID()}`),
      payload: tractorProfile,
    });
    expect(createdTractor.statusCode).toBe(201);
    const tractorId = requiredString(responseObject(createdTractor).tractorId, 'tractorId');

    const tractorList = await api.inject({
      method: 'GET',
      url: '/api/equipment/tractors',
      headers: headers(owner),
    });
    expect(tractorList.statusCode).toBe(200);
    const tractorRows = z.array(responseObjectSchema).parse(responseObject(tractorList).tractors);
    expect(tractorRows).toHaveLength(1);

    const updatedTractor = await api.inject({
      method: 'PATCH',
      url: `/api/equipment/tractors/${tractorId}`,
      headers: headers(owner, `tractor-update-${randomUUID()}`),
      payload: { ...tractorProfile, unitNumber: 'TR-181' },
    });
    expect(updatedTractor.statusCode).toBe(200);
    expect(
      nestedObject(responseObject(updatedTractor).profile, 'tractor profile').unitNumber,
    ).toBe('TR-181');

    const outsiderList = await api.inject({
      method: 'GET',
      url: '/api/equipment/tractors',
      headers: headers(outsider),
    });
    expect(outsiderList.statusCode).toBe(200);
    expect(responseObject(outsiderList).tractors).toHaveLength(0);

    const outsiderUpdate = await api.inject({
      method: 'PATCH',
      url: `/api/equipment/tractors/${tractorId}`,
      headers: headers(outsider, `tractor-cross-account-${randomUUID()}`),
      payload: { ...tractorProfile, unitNumber: 'STOLEN' },
    });
    expect(outsiderUpdate.statusCode).toBe(404);
  });
'''
          test_path.write_text(test_text[:-len(marker)] + profile_test + marker)

          openapi_test = Path('packages/api/test/openapi.test.ts')
          text = openapi_test.read_text()
          text = text.replace(
              "        '/api/drivers',\n",
              "        '/api/drivers',\n        '/api/drivers/{driverId}',\n",
              1,
          )
          text = text.replace(
              "        '/api/equipment/loads',\n        '/api/equipment/tractors',\n        '/api/equipment/trailers',\n",
              "        '/api/equipment/loads',\n        '/api/equipment/loads/{loadId}',\n        '/api/equipment/tractors',\n        '/api/equipment/tractors/{tractorId}',\n        '/api/equipment/trailers',\n        '/api/equipment/trailers/{trailerId}',\n",
              1,
          )
          openapi_test.write_text(text)
          PY
      - name: Commit profile API extension
        run: |
          rm .github/workflows/stage18-profile-api-bootstrap.yml
          git config user.name "TripRouteCalc Stage 18 Agent"
          git config user.email "actions@users.noreply.github.com"
          git add packages/api/src packages/api/test .github/workflows/stage18-profile-api-bootstrap.yml
          git commit -m "feat(stage18): expose reusable profile management"
          git push origin HEAD:agent/stage-18-mobile-trip-setup-ui
