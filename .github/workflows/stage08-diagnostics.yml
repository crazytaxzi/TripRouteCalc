name: Stage 08 lint fix

on:
  push:
    branches:
      - agent/stage-08-hos-automated-tests

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Stage 08 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-08-hos-automated-tests
      - name: Apply exact fixture lint corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/foundation/test/hos-test-fixtures.ts')
          text = path.read_text()
          replacements = {
              "overrides['departureAt']": 'overrides.departureAt',
              "overrides['departureTimeZone']": 'overrides.departureTimeZone',
              "overrides['cycleType']": 'overrides.cycleType',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected fixture expression was not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
      - name: Remove temporary Stage 08 files
        shell: bash
        run: |
          rm -f .stage08-diagnostic-trigger
          rm -f .github/workflows/stage08-diagnostics.yml
      - name: Commit lint corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix Stage 08 fixture lint findings"
          git push origin HEAD:agent/stage-08-hos-automated-tests
