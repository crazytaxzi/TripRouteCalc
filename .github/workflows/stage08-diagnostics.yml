name: Stage 08 diagnostics

on:
  push:
    branches:
      - agent/stage-08-hos-automated-tests

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint-diagnostics:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Capture Stage 08 lint output
        shell: bash
        run: |
          set +e
          pnpm exec eslint \
            packages/foundation/test/hos-test-fixtures.ts \
            packages/foundation/test/hos-acceptance.test.ts \
            packages/foundation/test/hos-engine-isolation.test.ts \
            packages/persistence/test/hos-domain-mapping.integration.test.ts \
            --max-warnings=0 > stage08-lint.log 2>&1
          status=$?
          printf '%s\n' "$status" > stage08-lint.exit
          exit 0
      - name: Post diagnostics to draft pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('stage08-lint.log', 'utf8');
            const exitCode = fs.readFileSync('stage08-lint.exit', 'utf8').trim();
            const marker = '<!-- stage08-lint-diagnostics -->';
            const body = `${marker}\nTemporary Stage 08 targeted lint diagnostics, exit code ${exitCode}:\n\n\`\`\`text\n${output.slice(-60000)}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 12,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 12,
                body,
              });
            }
