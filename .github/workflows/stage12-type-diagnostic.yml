name: Stage 12 Exact Optional Repair

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/stage12-type-diagnostic.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-12-regulatory-rules
          fetch-depth: 0
      - name: Extract bounded repair
        run: |
          python3 <<'PYEXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/stage12-optional-repair.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'
          Path('/tmp/stage12-optional-repair.py').write_text(script)
          PYEXTRACT
      - name: Apply exact optional repair
        run: python3 /tmp/stage12-optional-repair.py
      - name: Commit repaired sources
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages
          git commit -m 'Normalize Stage 12 exact optional contracts'
          git push origin HEAD:agent/stage-12-regulatory-rules
