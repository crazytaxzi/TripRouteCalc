name: Stage 17 API test lint repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-api-test-lint:
    if: github.head_ref == 'agent/stage-17-rest-api-validation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-17-rest-api-validation
          fetch-depth: 0
      - name: Repair test callback annotation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/api/test/server.integration.test.ts')
          text = path.read_text()
          old = "      now: () => new Date('2026-07-21T17:00:00.000Z'),\n"
          new = "      now: (): Date => new Date('2026-07-21T17:00:00.000Z'),\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected fixed clock callback once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/stage17-api-test-lint.yml').unlink()
          PY
      - name: Commit API test lint repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/test/server.integration.test.ts .github/workflows/stage17-api-test-lint.yml
          git commit -m 'Repair Stage 17 API test lint'
          git push origin HEAD:agent/stage-17-rest-api-validation
