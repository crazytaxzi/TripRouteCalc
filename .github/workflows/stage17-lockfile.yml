name: Stage 17 lockfile refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.head_ref == 'agent/stage-17-rest-api-validation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-17-rest-api-validation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Refresh workspace lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Remove one-shot workflow
        run: rm .github/workflows/stage17-lockfile.yml
      - name: Commit lockfile refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/stage17-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh lockfile for Stage 17 API package'
          git push origin HEAD:agent/stage-17-rest-api-validation
