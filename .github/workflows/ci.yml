name: Stage 12 Final Lint Repair

on:
  push:
    branches: [agent/stage-12-regulatory-rules]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-12-regulatory-rules
          fetch-depth: 0
      - name: Type string condition collections
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/compliance/src/regulatory-engine.ts')
          text = path.read_text()
          if text.count('      const actualValues =') != 1:
              raise RuntimeError('Expected one actual-values declaration.')
          if text.count('      const expectedValues =') != 1:
              raise RuntimeError('Expected one expected-values declaration.')
          text = text.replace(
              '      const actualValues =',
              '      const actualValues: readonly string[] =',
              1,
          )
          text = text.replace(
              '      const expectedValues =',
              '      const expectedValues: readonly string[] =',
              1,
          )
          path.write_text(text)
          PY
      - name: Commit repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/compliance/src/regulatory-engine.ts
          git commit -m 'Type Stage 12 string condition collections'
          git push origin HEAD:agent/stage-12-regulatory-rules
