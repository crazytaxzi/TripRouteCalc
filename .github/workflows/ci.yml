name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality

      - name: Capture encoded fixture repair error
        id: repair
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/stage16-fixture-patch.py
          set +e
          python /tmp/stage16-fixture-patch.py > stage16-fixture-repair-error.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo >> stage16-fixture-repair-error.txt
          echo "EXIT_STATUS=$status" >> stage16-fixture-repair-error.txt
          exit 0

      - name: Upload fixture repair error
        uses: actions/upload-artifact@v4
        with:
          name: stage16-fixture-repair-error
          path: stage16-fixture-repair-error.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve fixture repair failure
        if: steps.repair.outputs.status != '0'
        run: exit 1
