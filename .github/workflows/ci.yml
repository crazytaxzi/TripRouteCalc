name: Stage 04 one-time type fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'stage-04-clean-hos-inputs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 04 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified type corrections and restore permanent CI
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function replaceRequired(source, search, replacement, minimum = 1) {
            const count = source.split(search).length - 1;
            if (count < minimum) {
              throw new Error(`Expected at least ${minimum} occurrence(s) of: ${search}`);
            }
            return source.split(search).join(replacement);
          }

          const hosPath = 'packages/foundation/src/hos.ts';
          let hos = readFileSync(hosPath, 'utf8');
          hos = replaceRequired(
            hos,
            'export type DutyStatus = (typeof DUTY_STATUSES)[number];',
            'export type HosDutyStatus = (typeof DUTY_STATUSES)[number];',
          );
          hos = replaceRequired(
            hos,
            'readonly currentDutyStatus: DutyStatus;',
            'readonly currentDutyStatus: HosDutyStatus;',
            2,
          );
          hos = replaceRequired(
            hos,
            'readonly dutyStatus: DutyStatus;',
            'readonly dutyStatus: HosDutyStatus;',
          );
          hos = replaceRequired(
            hos,
            'function expectedClockEffects(status: DutyStatus): DutyEventClockEffects {',
            'function expectedClockEffects(status: HosDutyStatus): DutyEventClockEffects {',
          );
          writeFileSync(hosPath, hos);

          const testPath = 'packages/persistence/test/driver-hos.integration.test.ts';
          let test = readFileSync(testPath, 'utf8');
          test = replaceRequired(
            test,
            "import {\n  validateDriverHosDepartureState,",
            "import {\n  utcInstant,\n  validateDriverHosDepartureState,",
          );
          test = replaceRequired(
            test,
            "expectedHistoryStartAt: '2026-07-20T11:30:00.000Z',",
            "expectedHistoryStartAt: utcInstant('2026-07-20T11:30:00.000Z'),",
          );
          writeFileSync(testPath, test);
          NODE

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/src/hos.ts packages/persistence/test/driver-hos.integration.test.ts .github/workflows/ci.yml
          git commit -m "Fix Stage 04 type-check findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
