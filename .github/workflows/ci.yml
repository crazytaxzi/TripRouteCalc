name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Execute reviewed Stage 16 integration patch
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import textwrap

          workflow = subprocess.check_output(
              [
                  'git',
                  'show',
                  '1656e255a1f0a606d0b2c6613ad2e8ea054a6963:.github/workflows/stage16-eta-integration.yml',
              ],
              text=True,
          )
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          patch = textwrap.dedent(workflow[start:end])
          exec(compile(patch, 'stage16-eta-integration.py', 'exec'), {})
          PY

      - name: Commit Stage 16 ETA integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/src/eta-simulator.ts packages/foundation/src/confidence.ts
          git commit -m "Integrate confidence and explanations into ETA projections"
          git push origin HEAD:agent/stage-16-confidence-data-quality
