name: Stage 12 Final Lint Repair

on:
  push:
    branches: [agent/stage-12-regulatory-rules]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-12-regulatory-rules
          fetch-depth: 0
      - name: Normalize string collection indentation
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/compliance/src/regulatory-engine.ts')
          lines = path.read_text().splitlines()
          target = "typeof condition.value === 'string' ? [condition.value] : condition.value;"
          matches = [index for index, line in enumerate(lines) if line.strip() == target]
          if len(matches) != 1:
              raise RuntimeError(f'Expected one condition-value line, found {len(matches)}.')
          lines[matches[0]] = f'        {target}'
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit repair when needed
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- packages/compliance/src/regulatory-engine.ts; then
            echo 'String collection indentation is already normalized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/compliance/src/regulatory-engine.ts
          git commit -m 'Format Stage 12 string condition collections'
          git push origin HEAD:agent/stage-12-regulatory-rules
