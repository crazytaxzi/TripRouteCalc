name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable >/dev/null
          corepack prepare pnpm@9.15.4 --activate >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Apply safe acceptance-test lint fixes
        shell: bash
        run: |
          pnpm exec eslint packages/foundation/test/confidence.test.ts \
            packages/foundation/test/eta-confidence-explanations.test.ts --fix

      - name: Commit mechanical test fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/confidence.test.ts \
            packages/foundation/test/eta-confidence-explanations.test.ts
          if git diff --cached --quiet; then
            echo "No auto-fixable changes."
          else
            git commit -m "Apply Stage 16 acceptance test lint fixes"
            git push origin HEAD:agent/stage-16-confidence-data-quality
          fi
