name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-15-eta-simulator
          fetch-depth: 0

      - name: Add required verification timestamp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/persistence/test/eta-simulator.integration.test.ts')
          text = path.read_text(encoding='utf-8')
          old = """const provenance = Object.freeze({
            origin: 'CALCULATED' as const,
            verification: 'VERIFIED' as const,
            sourceName: 'Stage 15 persistence fixture',
            explanation: 'Deterministic test-only evidence.',
          });
          """.replace('          ', '')
          new = """const provenance = Object.freeze({
            origin: 'CALCULATED' as const,
            verification: 'VERIFIED' as const,
            verifiedAt: utcInstant('2026-07-20T14:58:00.000Z'),
            sourceName: 'Stage 15 persistence fixture',
            explanation: 'Deterministic test-only evidence.',
          });
          """.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one persistence provenance fixture.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit fixture repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/test/eta-simulator.integration.test.ts
          git commit -m "Correct ETA persistence provenance fixture"
          git push origin HEAD:agent/stage-15-eta-simulator
