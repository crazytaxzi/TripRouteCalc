name: Stage 12 Final Lint Repair

on:
  push:
    branches: [agent/stage-12-regulatory-rules]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-12-regulatory-rules
          fetch-depth: 0
      - name: Type string condition collections
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/compliance/src/regulatory-engine.ts')
          text = path.read_text()
          old = """      const actualValues = typeof actual === 'string' ? [actual] : actual;
                const expectedValues =
                  typeof condition.value === 'string' ? [condition.value] : condition.value;"""
          new = """      const actualValues: readonly string[] =
                typeof actual === 'string' ? [actual] : actual;
              const expectedValues: readonly string[] =
                typeof condition.value === 'string' ? [condition.value] : condition.value;"""
          if text.count(old) != 1:
              raise RuntimeError('Expected one string comparison block.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/compliance/src/regulatory-engine.ts
          git commit -m 'Type Stage 12 string condition collections'
          git push origin HEAD:agent/stage-12-regulatory-rules
