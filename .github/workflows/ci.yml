name: Stage 12 Final Lint Repair

on:
  push:
    branches: [agent/stage-12-regulatory-rules]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-12-regulatory-rules
          fetch-depth: 0
      - name: Normalize string collection indentation
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/compliance/src/regulatory-engine.ts')
          text = path.read_text()
          replacements = {
              "\n      typeof actual === 'string' ? [actual] : actual;":
                  "\n        typeof actual === 'string' ? [actual] : actual;",
              "\n    const expectedValues: readonly string[] =":
                  "\n      const expectedValues: readonly string[] =",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one indentation marker: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/compliance/src/regulatory-engine.ts
          git commit -m 'Format Stage 12 string condition collections'
          git push origin HEAD:agent/stage-12-regulatory-rules
