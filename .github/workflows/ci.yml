name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable >/dev/null
          corepack prepare pnpm@9.15.4 --activate >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Capture Stage 16 acceptance tests
        id: tests
        shell: bash
        run: |
          set +e
          pnpm exec vitest run \
            packages/foundation/test/confidence.test.ts \
            packages/foundation/test/eta-confidence-explanations.test.ts \
            > stage16-acceptance-tests.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo >> stage16-acceptance-tests.txt
          echo "EXIT_STATUS=$status" >> stage16-acceptance-tests.txt
          exit 0

      - name: Upload Stage 16 acceptance tests
        uses: actions/upload-artifact@v4
        with:
          name: stage16-acceptance-tests
          path: stage16-acceptance-tests.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve acceptance failure
        if: steps.tests.outputs.status != '0'
        run: exit 1
