name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-15-eta-simulator
          fetch-depth: 0

      - name: Correct stop-rest assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/foundation/test/eta-simulator.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "(event) => event.type === 'HOS_ACTION' && event.duration.value === 600,"
          new = "(event) => event.type === 'STOP_HOS_HOLD' && event.duration.value === 600,"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one 10-hour HOS_ACTION assertion.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit test repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/eta-simulator.test.ts
          git commit -m "Correct Stage 15 stop rest assertion"
          git push origin HEAD:agent/stage-15-eta-simulator
