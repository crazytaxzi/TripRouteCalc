name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-15-eta-simulator
          fetch-depth: 0

      - name: Preserve explicit stop timeline semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/foundation/src/eta-simulator.ts')
          text = path.read_text(encoding='utf-8')
          old = """function mappedStopEventType(event: DutyEvent): EtaTimelineEventType {
            if (event.eventType === 'PAPERWORK') return 'STOP_CHECK_IN';
            if (event.eventType === 'BREAK' || event.eventType === 'REST') {
              return 'STOP_HOS_HOLD';
            }
            if (event.eventType === 'STATUS_CHANGE') return 'STOP_WAIT';
            return 'STOP_SERVICE';
          }
          """.replace('          ', '')
          new = """function mappedStopEventType(
            event: DutyEvent,
            stopTimeline: StopProcessingResult['timeline'],
          ): EtaTimelineEventType {
            const explicitType = stopTimeline.find(
              (candidate) => candidate.dutyEventId === event.id,
            )?.type;
            switch (explicitType) {
              case 'APPOINTMENT_WAIT':
                return 'STOP_WAIT';
              case 'CHECK_IN':
                return 'STOP_CHECK_IN';
              case 'SERVICE':
                return 'STOP_SERVICE';
              case 'HOS_HOLD':
                return 'STOP_HOS_HOLD';
              case 'ARRIVAL':
              case 'DEPARTURE':
                break;
            }
            if (event.eventType === 'PAPERWORK') return 'STOP_CHECK_IN';
            if (event.eventType === 'BREAK' || event.eventType === 'REST') {
              return 'STOP_HOS_HOLD';
            }
            if (event.eventType === 'STATUS_CHANGE') return 'STOP_WAIT';
            return 'STOP_SERVICE';
          }
          """.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one mappedStopEventType implementation.')
          text = text.replace(old, new)
          old_call = "type: mappedStopEventType(event),"
          new_call = "type: mappedStopEventType(event, result.timeline),"
          if text.count(old_call) != 1:
              raise SystemExit('Expected exactly one mappedStopEventType call.')
          path.write_text(text.replace(old_call, new_call), encoding='utf-8')
          PY

      - name: Commit product repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/src/eta-simulator.ts
          git commit -m "Preserve explicit stop timeline semantics"
          git push origin HEAD:agent/stage-15-eta-simulator
