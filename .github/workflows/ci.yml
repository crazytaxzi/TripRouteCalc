name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable >/dev/null
          corepack prepare pnpm@9.15.4 --activate >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Generate Prisma client
        run: pnpm db:generate >/dev/null

      - name: Capture repository lint output
        id: lint
        shell: bash
        run: |
          set +e
          pnpm lint:source > stage16-repository-lint.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo >> stage16-repository-lint.txt
          echo "EXIT_STATUS=$status" >> stage16-repository-lint.txt
          exit 0

      - name: Upload repository lint diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: stage16-repository-lint
          path: stage16-repository-lint.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve lint failure
        if: steps.lint.outputs.status != '0'
        run: exit 1
