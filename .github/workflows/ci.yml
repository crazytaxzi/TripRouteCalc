name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable >/dev/null
          corepack prepare pnpm@9.15.4 --activate >/dev/null

      - name: Install dependencies quietly
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Generate Prisma client quietly
        run: pnpm db:generate >/dev/null

      - name: Type-check
        run: pnpm typecheck:source
