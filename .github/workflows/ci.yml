name: Stage 11 Recovery Diagnostic

on:
  push:
    branches:
      - agent/stage-11-commercial-routing-provider
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stage-11-commercial-routing-provider

      - name: Capture standalone repair result
        shell: bash
        run: |
          set +e
          python3 .stage11_fix.py > stage11-recovery.log 2>&1
          code=$?
          printf '%s\n' "$code" > stage11-recovery.exit
          git status --short > stage11-recovery.status
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > stage11-recovery.workflows
          exit 0

      - name: Upload recovery diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: stage11-recovery-diagnostic
          path: |
            stage11-recovery.log
            stage11-recovery.exit
            stage11-recovery.status
            stage11-recovery.workflows
          if-no-files-found: error
