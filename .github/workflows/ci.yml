name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Repair Stage 16 contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'packages/foundation/src/eta-simulator.ts',
              """    state.confidenceReasons.push(...result.explanations);
              return true;
          """.replace('          ', ''),
              """    for (const explanation of result.explanations) {
                state.confidenceReasons.push(
                  dataQualityReason(
                    'OPTIONAL_OPERATIONAL_EVENT_UNPLACED',
                    [
                      publicEvidenceReference(
                        'EVENT',
                        plan.eventId,
                        'Optional operational event',
                      ),
                    ],
                    'An optional operational event could not be placed, so the projection omits it.',
                    explanation,
                  ),
                );
              }
              return true;
          """.replace('          ', ''),
              'optional operational confidence reason',
          )

          replace_once(
              'packages/foundation/test/eta-simulator.test.ts',
              """                  path: 'legs[].segments[].travelDuration',
                    reason: 'Provider travel time was unavailable in this fixture.',
                  },
          """.replace('          ', ''),
              """                  path: 'legs[].segments[].travelDuration',
                    reason: 'Provider travel time was unavailable in this fixture.',
                    impact: 'lowers-confidence' as const,
                  },
          """.replace('          ', ''),
              'fixture unavailable-field impact',
          )

          replace_once(
              'packages/persistence/src/trip-revision-repository.ts',
              """  Duration,
                LocalAppointmentWindow,
          """.replace('          ', ''),
              """  ConfidenceReason,
                Duration,
                LocalAppointmentWindow,
          """.replace('          ', ''),
              'confidence reason import',
          )
          replace_once(
              'packages/persistence/src/trip-revision-repository.ts',
              """export interface CreateCalculationResultInput {
                readonly confidence: 'high' | 'medium' | 'low' | 'blocked';
                readonly confidenceReasons: readonly string[];
          """.replace('          ', ''),
              """export interface CreateCalculationResultInput {
                readonly confidence: 'high' | 'moderate' | 'low' | 'unverified';
                readonly confidenceReasons: readonly ConfidenceReason[];
          """.replace('          ', ''),
              'calculation result confidence contract',
          )

          replace_once(
              'packages/persistence/src/repository-shared.ts',
              """export const PRISMA_CALCULATION_CONFIDENCE: Readonly<
                Record<'high' | 'medium' | 'low' | 'blocked', PrismaCalculationConfidence>
              > = {
                high: 'HIGH',
                medium: 'MEDIUM',
                low: 'LOW',
                blocked: 'BLOCKED',
              };
          """.replace('          ', ''),
              """export const PRISMA_CALCULATION_CONFIDENCE: Readonly<
                Record<'high' | 'moderate' | 'low' | 'unverified', PrismaCalculationConfidence>
              > = {
                high: 'HIGH',
                moderate: 'MODERATE',
                low: 'LOW',
                unverified: 'UNVERIFIED',
              };
          """.replace('          ', ''),
              'Prisma confidence mapping',
          )

          replace_once(
              'packages/persistence/prisma/schema.prisma',
              """enum CalculationConfidence {
                HIGH    @map("high")
                MEDIUM  @map("medium")
                LOW     @map("low")
                BLOCKED @map("blocked")
              }
          """.replace('          ', ''),
              """enum CalculationConfidence {
                HIGH       @map("high")
                MODERATE   @map("moderate")
                LOW        @map("low")
                UNVERIFIED @map("unverified")
              }
          """.replace('          ', ''),
              'Prisma confidence enum',
          )
          PY

          mkdir -p packages/persistence/prisma/migrations/20260721150000_stage_16_confidence_levels
          cat > packages/persistence/prisma/migrations/20260721150000_stage_16_confidence_levels/migration.sql <<'SQL'
          ALTER TYPE "CalculationConfidence" RENAME VALUE 'medium' TO 'moderate';
          ALTER TYPE "CalculationConfidence" RENAME VALUE 'blocked' TO 'unverified';
          SQL

      - name: Commit Stage 16 persistence repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/src/eta-simulator.ts \
            packages/foundation/test/eta-simulator.test.ts \
            packages/persistence/src/trip-revision-repository.ts \
            packages/persistence/src/repository-shared.ts \
            packages/persistence/prisma/schema.prisma \
            packages/persistence/prisma/migrations/20260721150000_stage_16_confidence_levels/migration.sql
          git commit -m "Align Stage 16 confidence persistence"
          git push origin HEAD:agent/stage-16-confidence-data-quality
