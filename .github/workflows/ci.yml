name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage15-final-lint-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Stage 15 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-15-eta-simulator
          fetch-depth: 0
          show-progress: false

      - name: Remove redundant destination guard
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('packages/foundation/src/eta-simulator.ts')
          text = path.read_text()
          old = '''    if (destination === undefined) {
              throw new EtaSimulationError(
                'ROUTE_STOP_MISMATCH',
                `Missing destination stop for leg ${leg.legId}.`,
              );
            }
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one redundant destination guard; found {text.count(old)}')
          path.write_text(text.replace(old, '', 1))
          PY

      - name: Commit bounded lint repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/foundation/src/eta-simulator.ts
          git commit -m 'Remove redundant Stage 15 destination guard'
          git push origin HEAD:agent/stage-15-eta-simulator

  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply migrations to clean PostgreSQL database
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint:source

      - name: Type-check
        run: pnpm typecheck:source

      - name: Test
        run: pnpm test:source

      - name: Build
        run: pnpm build:source
