name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-reviewed-fixes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Stage 03 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-03-persistence-revisions

      - name: Apply reviewed source fixes
        run: |
          cat > /tmp/stage03-fixes.b64 <<'ARCHIVE'

ARCHIVE
          base64 --decode /tmp/stage03-fixes.b64 > /tmp/stage03-fixes.tar.gz
          tar -xzf /tmp/stage03-fixes.tar.gz -C .
          git rm .github/workflows/stage03-apply-fixes.yml
          git diff --check

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            packages/persistence/src/repositories.ts \
            packages/persistence/src/json.ts \
            packages/persistence/test/persistence.integration.test.ts \
            tsconfig.typecheck.json \
            vitest.config.ts
          git commit -m "Fix Stage 03 verification defects"
          git push origin HEAD:agent/stage-03-persistence-revisions

  verification:
    needs: apply-reviewed-fixes
    if: always() && needs.apply-reviewed-fixes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out updated branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-03-persistence-revisions

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply migrations to clean PostgreSQL database
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint:source

      - name: Type-check
        run: pnpm typecheck:source

      - name: Test
        run: pnpm test:source

      - name: Build
        run: pnpm build:source
