name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Capture Stage 16 integration patch traceback
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import textwrap
          import traceback
          from pathlib import Path

          output = Path('stage16-patch-traceback.txt')
          try:
              workflow = subprocess.check_output(
                  [
                      'git',
                      'show',
                      '1656e255a1f0a606d0b2c6613ad2e8ea054a6963:.github/workflows/stage16-eta-integration.yml',
                  ],
                  text=True,
              )
              marker = "          python - <<'PY'\n"
              start = workflow.index(marker) + len(marker)
              end = workflow.index("          PY\n", start)
              patch = textwrap.dedent(workflow[start:end])
              exec(compile(patch, 'stage16-eta-integration.py', 'exec'), {})
              output.write_text('PATCH_SUCCEEDED\n', encoding='utf-8')
          except Exception:
              output.write_text(traceback.format_exc(), encoding='utf-8')
          PY

      - name: Upload integration traceback
        uses: actions/upload-artifact@v4
        with:
          name: stage16-patch-traceback
          path: stage16-patch-traceback.txt
          if-no-files-found: error
          retention-days: 1
