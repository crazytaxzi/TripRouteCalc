name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Repair fixture contracts semantically
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          eta_path = Path('packages/foundation/test/eta-simulator.test.ts')
          eta = eta_path.read_text(encoding='utf-8')
          eta, count = re.subn(
              r"\s*\.\.\.\(segment\.unavailableTravelTime\s*\? \{\}\s*:\s*\{ travelDuration: durationInMinutes\(segment\.minutes\) \}\),",
              "\n          travelDuration: durationInMinutes(segment.minutes),",
              eta,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one conditional duration block, found {count}')
          eta_path.write_text(eta, encoding='utf-8')

          persistence_path = Path('packages/persistence/test/persistence.integration.test.ts')
          persistence = persistence_path.read_text(encoding='utf-8')
          if 'dataQualityReason,' not in persistence:
              persistence = persistence.replace(
                  "import {\n  durationInMinutes,",
                  "import {\n  dataQualityReason,\n  durationInMinutes,",
                  1,
              )
          if 'publicEvidenceReference,' not in persistence:
              persistence = persistence.replace(
                  "  localDateTime,\n  utcInstant,",
                  "  localDateTime,\n  publicEvidenceReference,\n  utcInstant,",
                  1,
              )
          old = "confidenceReasons: ['No commercial route provider is configured.'],"
          if old not in persistence:
              raise SystemExit('Legacy string confidence reason was not found.')
          new = """confidenceReasons: [
        dataQualityReason(
          'PROVIDER_RESTRICTIONS_UNAVAILABLE',
          [
            publicEvidenceReference(
              'PROVIDER',
              'commercial-route-provider',
              'Commercial-route provider evidence',
            ),
          ],
          'No commercial route provider is configured.',
          'This persistence fixture intentionally lacks commercial-route provider evidence.',
        ),
      ],"""
          persistence_path.write_text(
              persistence.replace(old, new, 1),
              encoding='utf-8',
          )
          PY

      - name: Commit fixture repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/eta-simulator.test.ts \
            packages/persistence/test/persistence.integration.test.ts
          git commit -m "Repair Stage 16 fixture contracts"
          git push origin HEAD:agent/stage-16-confidence-data-quality
