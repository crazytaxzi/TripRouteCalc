name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply migrations to clean PostgreSQL database
        run: pnpm db:migrate:deploy

      - name: Prepare verification logs
        run: mkdir -p .ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint:source 2>&1 | tee .ci/lint.log

      - name: Type-check
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck:source 2>&1 | tee .ci/typecheck.log

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm test:source 2>&1 | tee .ci/test.log

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build:source 2>&1 | tee .ci/build.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: .ci
          if-no-files-found: error

      - name: Enforce verification gates
        if: always()
        run: |
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
