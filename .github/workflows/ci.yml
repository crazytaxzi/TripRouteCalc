name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Replace unsafe asymmetric matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/foundation/test/eta-simulator.test.ts')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = 319
          end = 327
          if not lines[start].strip().startswith('expect(result.expected.confidenceReasons)'):
              raise SystemExit(f'Unexpected line {start + 1}: {lines[start]}')
          if lines[end - 1].strip() != ');':
              raise SystemExit(f'Unexpected line {end}: {lines[end - 1]}')
          replacement = [
              '    expect(',
              '      result.expected.confidenceReasons.some(',
              '        (reason) =>',
              "          reason.code === 'AVERAGE_SPEED_FALLBACK' &&",
              "          reason.userExplanation.includes('average-speed fallback'),",
              '      ),',
              '    ).toBe(true);',
          ]
          lines[start:end] = replacement
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit assertion repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/eta-simulator.test.ts
          git commit -m "Use typed Stage 16 confidence assertion"
          git push origin HEAD:agent/stage-16-confidence-data-quality
