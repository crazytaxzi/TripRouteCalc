name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Repair current TypeScript fixture contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          eta_test = Path('packages/foundation/test/eta-simulator.test.ts')
          eta_text = eta_test.read_text(encoding='utf-8')
          old_duration = """          ...(segment.unavailableTravelTime
                        ? {}
                        : { travelDuration: durationInMinutes(segment.minutes) }),
          """.replace('          ', '')
          new_duration = "          travelDuration: durationInMinutes(segment.minutes),\n"
          if old_duration not in eta_text:
              raise SystemExit('Conditional segment travel duration was not found.')
          eta_test.write_text(
              eta_text.replace(old_duration, new_duration, 1),
              encoding='utf-8',
          )

          persistence_test = Path('packages/persistence/test/persistence.integration.test.ts')
          persistence_text = persistence_test.read_text(encoding='utf-8')
          old_import = """import {
            durationInMinutes,
          """.replace('          ', '')
          new_import = """import {
            dataQualityReason,
            durationInMinutes,
            publicEvidenceReference,
          """.replace('          ', '')
          if old_import not in persistence_text:
              raise SystemExit('Foundation import block was not found.')
          persistence_text = persistence_text.replace(old_import, new_import, 1)
          old_reason = "      confidenceReasons: ['No commercial route provider is configured.'],"
          new_reason = """      confidenceReasons: [
                dataQualityReason(
                  'PROVIDER_RESTRICTIONS_UNAVAILABLE',
                  [
                    publicEvidenceReference(
                      'PROVIDER',
                      'commercial-route-provider',
                      'Commercial-route provider evidence',
                    ),
                  ],
                  'No commercial route provider is configured.',
                  'This persistence fixture intentionally lacks commercial-route provider evidence.',
                ),
              ],
          """.replace('          ', '')
          if old_reason not in persistence_text:
              raise SystemExit('Legacy string confidence reason was not found.')
          persistence_test.write_text(
              persistence_text.replace(old_reason, new_reason, 1),
              encoding='utf-8',
          )
          PY

      - name: Commit fixture repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/eta-simulator.test.ts \
            packages/persistence/test/persistence.integration.test.ts
          git commit -m "Repair Stage 16 fixture contracts"
          git push origin HEAD:agent/stage-16-confidence-data-quality
