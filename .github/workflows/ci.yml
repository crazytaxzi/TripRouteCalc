name: Stage 04 one-time lint fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'stage-04-clean-hos-inputs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 04 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified lint corrections and restore permanent CI
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = 'packages/foundation/src/hos.ts';
          let source = readFileSync(path, 'utf8');

          function replaceRequired(search, replacement, minimum = 1) {
            const count = source.split(search).length - 1;
            if (count < minimum) {
              throw new Error(`Expected at least ${minimum} occurrence(s) of: ${search}`);
            }
            source = source.split(search).join(replacement);
          }

          replaceRequired('  return value as T[number];', '  return value;');
          replaceRequired('${minimum}', '${String(minimum)}', 2);
          replaceRequired('${CYCLE_MINUTES[cycleType]}', '${String(CYCLE_MINUTES[cycleType])}');
          replaceRequired('${requiredPriorDays}', '${String(requiredPriorDays)}');
          replaceRequired('${index}', '${String(index)}', 10);
          replaceRequired(
            "    const minimum = sleeperPair.candidateRole === 'LONG_PERIOD' ? 7 * 60 : 2 * 60;",
            "    const candidateRole = sleeperPair.candidateRole ?? 'SHORT_PERIOD';\n    const minimum = candidateRole === 'LONG_PERIOD' ? 7 * 60 : 2 * 60;",
          );
          replaceRequired('${sleeperPair.candidateRole}', '${candidateRole}');
          replaceRequired(
            '${Math.max(0, events.length - 1)}',
            '${String(Math.max(0, events.length - 1))}',
          );

          writeFileSync(path, source);
          NODE

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/src/hos.ts .github/workflows/ci.yml
          git commit -m "Fix Stage 04 lint findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
