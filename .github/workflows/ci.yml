name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-15-eta-simulator
          fetch-depth: 0

      - name: Repair immutable speed-model type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('packages/foundation/src/eta-simulator.ts')
          text = source.read_text(encoding='utf-8')
          old = "export type EtaSpeedModel = Readonly<z.infer<typeof EtaSpeedModelSchema>>;\n"
          new = """export type EtaSpeedModel = Readonly<
            Omit<z.infer<typeof EtaSpeedModelSchema>, 'roadClassSpeeds'> & {
              readonly roadClassSpeeds: readonly Readonly<
                z.infer<typeof EtaRoadClassSpeedSchema>
              >[];
            }
          >;
          """
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one EtaSpeedModel type alias.')
          source.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit product repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/src/eta-simulator.ts
          git commit -m "Preserve immutable ETA speed model inputs"
          git push origin HEAD:agent/stage-15-eta-simulator
