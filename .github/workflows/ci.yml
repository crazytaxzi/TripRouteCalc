name: Stage 11 Lockfile Recovery

on:
  push:
    branches:
      - agent/stage-11-commercial-routing-provider
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.ref == 'refs/heads/agent/stage-11-commercial-routing-provider' || github.head_ref == 'agent/stage-11-commercial-routing-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stage-11-commercial-routing-provider

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Generate workspace lock importer
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Restore permanent CI and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/stage11-transparent-patch.yml

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Generate Stage 11 routing workspace lock"
          git push origin HEAD:agent/stage-11-commercial-routing-provider
