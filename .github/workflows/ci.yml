name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable >/dev/null
          corepack prepare pnpm@9.15.4 --activate >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Prepare database
        run: |
          pnpm db:generate >/dev/null
          pnpm db:migrate:deploy >/dev/null

      - name: Capture runtime test output
        id: tests
        shell: bash
        run: |
          set +e
          pnpm test:source > stage16-tests.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo >> stage16-tests.txt
          echo "EXIT_STATUS=$status" >> stage16-tests.txt
          exit 0

      - name: Upload runtime test diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: stage16-tests
          path: stage16-tests.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve test failure
        if: steps.tests.outputs.status != '0'
        run: exit 1
