name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Capture narrowed Stage 16 patch output
        shell: bash
        run: |
          git show 1656e255a1f0a606d0b2c6613ad2e8ea054a6963:.github/workflows/stage16-eta-integration.yml > /tmp/stage16-workflow.yml
          sed -n "/python - <<'PY'/,/^          PY$/p" /tmp/stage16-workflow.yml \
            | sed '1d;$d;s/^          //' > /tmp/stage16-patch.py
          python - <<'PATCHFIX'
          from pathlib import Path

          path = Path('/tmp/stage16-patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              "readonly confidenceReasons: readonly string[];",
              "readonly confidenceReasons: readonly ConfidenceReason[];",
              'speed decision confidence reasons',
          )'''
          new = '''replace_once(
              """  readonly source: 'VERIFIED_PROVIDER_TIME' | 'FALLBACK_AVERAGE';
            readonly limitingFactors: readonly string[];
            readonly confidenceReasons: readonly string[];
            readonly explanation: string;
          """.replace('          ', ''),
              """  readonly source: 'VERIFIED_PROVIDER_TIME' | 'FALLBACK_AVERAGE';
            readonly limitingFactors: readonly string[];
            readonly confidenceReasons: readonly ConfidenceReason[];
            readonly explanation: string;
          """.replace('          ', ''),
              'speed decision confidence reasons',
          )'''
          if text.count(old) != 1:
              raise SystemExit('Could not narrow speed-decision confidence replacement.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PATCHFIX
          set +e
          python /tmp/stage16-patch.py > stage16-patch-output.txt 2>&1
          status=$?
          echo >> stage16-patch-output.txt
          echo "EXIT_STATUS=$status" >> stage16-patch-output.txt
          exit 0

      - name: Upload narrowed patch output
        uses: actions/upload-artifact@v4
        with:
          name: stage16-patch-output
          path: stage16-patch-output.txt
          if-no-files-found: error
          retention-days: 1
