name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Decode and apply token-bounded repair
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/stage16-fixture-patch.py
          python /tmp/stage16-fixture-patch.py

      - name: Commit fixture repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/eta-simulator.test.ts packages/persistence/test/persistence.integration.test.ts
          git commit -m "Repair Stage 16 fixture contracts"
          git push origin HEAD:agent/stage-16-confidence-data-quality
