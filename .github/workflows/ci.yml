name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable >/dev/null
          corepack prepare pnpm@9.15.4 --activate >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Generate Prisma client
        run: pnpm db:generate >/dev/null

      - name: Apply safe repository lint fixes
        shell: bash
        run: pnpm exec eslint packages --fix

      - name: Commit mechanical lint fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          if git diff --cached --quiet; then
            echo "No auto-fixable changes."
          else
            git commit -m "Apply repository Stage 16 lint fixes"
            git push origin HEAD:agent/stage-16-confidence-data-quality
          fi
