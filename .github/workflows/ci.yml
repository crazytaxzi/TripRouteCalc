name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Add explicit helper return type
        shell: bash
        run: >-
          python -c "from pathlib import Path; p=Path('packages/foundation/test/confidence.test.ts'); t=p.read_text(encoding='utf-8'); t=t.replace('  ConfidenceReasonCode,\n  TripDataQualityInput,', '  ConfidenceReasonCode,\n  PublicEvidenceReference,\n  TripDataQualityInput,', 1); t=t.replace('function inputReference(reference: string) {', 'function inputReference(reference: string): PublicEvidenceReference {', 1); p.write_text(t, encoding='utf-8')"

      - name: Commit helper type
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/confidence.test.ts
          git commit -m "Type Stage 16 confidence test helper"
          git push origin HEAD:agent/stage-16-confidence-data-quality
