name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply migrations to clean PostgreSQL database
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm exec eslint . --max-warnings=0 --format json --output-file lint-results.json

      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint-results.json
          if-no-files-found: ignore

      - name: Type-check
        run: pnpm typecheck:source

      - name: Test
        run: pnpm test:source

      - name: Build
        run: pnpm build:source
