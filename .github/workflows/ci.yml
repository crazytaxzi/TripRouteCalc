name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Capture Stage 16 integration patch traceback
        shell: bash
        run: |
          git show 1656e255a1f0a606d0b2c6613ad2e8ea054a6963:.github/workflows/stage16-eta-integration.yml > /tmp/stage16-workflow.yml
          sed -n "/python - <<'PY'/,/^          PY$/p" /tmp/stage16-workflow.yml \
            | sed '1d;$d;s/^          //' > /tmp/stage16-patch.py
          set +e
          python /tmp/stage16-patch.py > stage16-patch-traceback.txt 2>&1
          status=$?
          echo >> stage16-patch-traceback.txt
          echo "EXIT_STATUS=$status" >> stage16-patch-traceback.txt
          exit 0

      - name: Upload integration traceback
        uses: actions/upload-artifact@v4
        with:
          name: stage16-patch-traceback
          path: stage16-patch-traceback.txt
          if-no-files-found: error
          retention-days: 1
