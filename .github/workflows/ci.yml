name: Stage 04 completion ledger update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-ledger:
    if: github.head_ref == 'stage-04-clean-hos-inputs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 04 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Mark Stage 04 complete and restore permanent CI
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function replaceRequired(source, search, replacement) {
            if (!source.includes(search)) {
              throw new Error(`Expected text was not found: ${search}`);
            }
            return source.replace(search, replacement);
          }

          const readmePath = 'README.md';
          let readme = readFileSync(readmePath, 'utf8');
          readme = replaceRequired(
            readme,
            'The canonical private repository is established on `main`. Stages 01 through 03 are complete, and Stage 04 is under verification.',
            'The canonical private repository is established on `main`. Stages 01 through 04 are complete.',
          );
          readme = replaceRequired(
            readme,
            '- Stage 04: Driver HOS Inputs and Duty Events, VERIFICATION PENDING',
            '- Stage 04: Driver HOS Inputs and Duty Events, COMPLETE',
          );
          readme = replaceRequired(
            readme,
            '- `docs/specification/04_DRIVER_HOS_INPUTS_AND_DUTY_EVENTS.md`',
            '- `docs/specification/05_HOS_CORE_CLOCKS_AND_INTERRUPTION.md`',
          );
          readme = replaceRequired(
            readme,
            'Complete Stage 04 verification using `docs/specification/04_DRIVER_HOS_INPUTS_AND_DUTY_EVENTS.md`. Do not begin Stage 05 until the Stage 04 migration, lint, type-check, tests, build, handoff, and exit-gate audit all pass.',
            'Begin Stage 05 using `docs/specification/05_HOS_CORE_CLOCKS_AND_INTERRUPTION.md`. Reinspect the accepted Stage 04 contracts and consume its recorded facts without replacing or inferring them.',
          );
          writeFileSync(readmePath, readme);

          const statusPath = 'docs/implementation/STATUS.md';
          let status = readFileSync(statusPath, 'utf8');
          status = replaceRequired(status, '- Active pull request: pending', '- Active pull request: `#4`');
          status = replaceRequired(
            status,
            '- Product status: validated driver HOS departure-state and timestamped duty-event implementation assembled; authoritative CI verification pending',
            '- Product status: validated driver HOS departure-state and timestamped duty-event implementation complete and verified',
          );
          status = replaceRequired(
            status,
            '- Completed sources: `01_REPOSITORY_AUDIT_AND_PLAN.md`, `02_PRODUCT_FOUNDATION_DOMAIN_UNITS_TIME.md`, `03_PERSISTENCE_REVISIONS_AUDITABILITY.md`',
            '- Completed sources: `01_REPOSITORY_AUDIT_AND_PLAN.md`, `02_PRODUCT_FOUNDATION_DOMAIN_UNITS_TIME.md`, `03_PERSISTENCE_REVISIONS_AUDITABILITY.md`, `04_DRIVER_HOS_INPUTS_AND_DUTY_EVENTS.md`',
          );
          status = replaceRequired(
            status,
            '- Active source: `04_DRIVER_HOS_INPUTS_AND_DUTY_EVENTS.md`',
            '- Next source: `05_HOS_CORE_CLOCKS_AND_INTERRUPTION.md`',
          );
          status = replaceRequired(status, '- Stage 04 status: VERIFICATION PENDING', '- Stage 04 status: COMPLETE');
          status = replaceRequired(
            status,
            '- Database migrations: Stage 03 initial migration plus the pending Stage 04 append-only HOS evidence migration',
            '- Database migrations: Stage 03 initial migration plus the verified Stage 04 append-only HOS evidence migration',
          );
          status = replaceRequired(status, '## Stage 04 implementation assembled', '## Stage 04 completed');
          const verificationStart = status.indexOf('## Verification evidence so far');
          const limitationsStart = status.indexOf('## Deferred decisions and limitations');
          if (verificationStart < 0 || limitationsStart < 0 || limitationsStart <= verificationStart) {
            throw new Error('Could not locate the Stage 04 verification section.');
          }
          const verificationSection = `## Verification evidence

GitHub Actions CI run 128 passed against a clean PostgreSQL 18 service:

- \`pnpm install --frozen-lockfile\`
- \`pnpm db:generate\`
- \`pnpm db:validate\`
- \`pnpm db:migrate:deploy\`
- \`pnpm lint:source\`
- \`pnpm typecheck:source\`
- \`pnpm test:source\`
- \`pnpm build:source\`

The isolated pre-publication checks also passed with Node.js 22.16.0 and TypeScript 5.8.3, including strict compilation and 11 focused HOS and persistence harness tests. The pull-request workflow exposed and verified corrections for migration foreign-key naming, strict lint formatting, an exported type-name collision, and one unbranded test timestamp.

`;
          status = status.slice(0, verificationStart) + verificationSection + status.slice(limitationsStart);
          status = replaceRequired(
            status,
            'Do not begin the next source until Stage 04 CI and the exit-gate audit pass. The next source after acceptance is `05_HOS_CORE_CLOCKS_AND_INTERRUPTION.md`.',
            'Stage 04 is complete. Begin the next dedicated implementation stage with `05_HOS_CORE_CLOCKS_AND_INTERRUPTION.md` after reinspecting the accepted Stage 04 contracts on `main`.',
          );
          writeFileSync(statusPath, status);

          const blockersPath = 'docs/implementation/BLOCKERS.md';
          let blockers = readFileSync(blockersPath, 'utf8');
          if (!blockers.includes('## Stage 04 blocker review')) {
            blockers += `

## Stage 04 blocker review

**Status:** No active Stage 04 blocker

Stage 04 required no commercial-routing provider, production regulatory source, authentication system, or deployment target. The complete driver departure state, timestamped duty-event history, provenance, tenant-scoped append-only persistence, PostgreSQL migration, unit and integration tests, lint, type-check, and build are verified. B-002 through B-004 remain visible later-stage concerns and must not be disguised with inferred clocks, fake providers, placeholder legal rules, or unverified operational claims.
`;
          }
          writeFileSync(blockersPath, blockers);
          NODE

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/implementation/STATUS.md docs/implementation/BLOCKERS.md .github/workflows/ci.yml
          git commit -m "Complete Stage 04 implementation ledger"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
