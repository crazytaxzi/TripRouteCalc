name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Replace unsafe asymmetric matcher
        shell: bash
        run: >-
          python -c "from pathlib import Path; import base64; p=Path('packages/foundation/test/eta-simulator.test.ts'); t=p.read_text(encoding='utf-8'); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert t.count(old)==1; p.write_text(t.replace(old,new), encoding='utf-8')"

      - name: Commit assertion repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/eta-simulator.test.ts
          git commit -m "Use typed Stage 16 confidence assertion"
          git push origin HEAD:agent/stage-16-confidence-data-quality
