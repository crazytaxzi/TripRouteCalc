name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Repair exact fixture contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          eta_path = Path('packages/foundation/test/eta-simulator.test.ts')
          eta = eta_path.read_text(encoding='utf-8')
          old = """          ...(segment.unavailableTravelTime
            ? {}
            : { travelDuration: durationInMinutes(segment.minutes) }),
          """
          new = "          travelDuration: durationInMinutes(segment.minutes),\n"
          if eta.count(old) != 1:
              raise SystemExit(f'Expected one conditional duration block, found {eta.count(old)}')
          eta_path.write_text(eta.replace(old, new), encoding='utf-8')

          persistence_path = Path('packages/persistence/test/persistence.integration.test.ts')
          persistence = persistence_path.read_text(encoding='utf-8')
          old_import = """import {
            durationInMinutes,
            ianaTimeZone,
          """.replace('          ', '')
          new_import = """import {
            dataQualityReason,
            durationInMinutes,
            ianaTimeZone,
            publicEvidenceReference,
          """.replace('          ', '')
          if persistence.count(old_import) != 1:
              raise SystemExit(f'Expected one foundation import block, found {persistence.count(old_import)}')
          persistence = persistence.replace(old_import, new_import, 1)
          old_reason = "      confidenceReasons: ['No commercial route provider is configured.'],"
          new_reason = """      confidenceReasons: [
            dataQualityReason(
              'PROVIDER_RESTRICTIONS_UNAVAILABLE',
              [
                publicEvidenceReference(
                  'PROVIDER',
                  'commercial-route-provider',
                  'Commercial-route provider evidence',
                ),
              ],
              'No commercial route provider is configured.',
              'This persistence fixture intentionally lacks commercial-route provider evidence.',
            ),
          ],
          """.rstrip()
          if persistence.count(old_reason) != 1:
              raise SystemExit(f'Expected one legacy string confidence reason, found {persistence.count(old_reason)}')
          persistence_path.write_text(
              persistence.replace(old_reason, new_reason, 1),
              encoding='utf-8',
          )
          PY

      - name: Commit fixture repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/eta-simulator.test.ts \
            packages/persistence/test/persistence.integration.test.ts
          git commit -m "Repair Stage 16 fixture contracts"
          git push origin HEAD:agent/stage-16-confidence-data-quality
