name: Stage 11 Snapshot Recovery

on:
  push:
    branches:
      - agent/stage-11-commercial-routing-provider
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stage-11-commercial-routing-provider

      - name: Apply Stage 11 snapshot fix
        run: python3 .stage11_fix.py

      - name: Restore permanent CI
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Commit Stage 11 snapshot fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Stage 11 route snapshot contract"
          git push origin HEAD:agent/stage-11-commercial-routing-provider
