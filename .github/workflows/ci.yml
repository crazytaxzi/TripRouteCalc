name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality
          fetch-depth: 0

      - name: Align urban speed cap assertion
        shell: bash
        run: >-
          python -c "from pathlib import Path; p=Path('packages/foundation/test/eta-simulator.test.ts'); t=p.read_text(encoding='utf-8'); old=\"expect(decision?.limitingFactors.join(' ')).toContain('urban cap');\"; new=\"expect(decision?.limitingFactors.join(' ')).toContain('urban speed cap');\"; assert t.count(old)==1; p.write_text(t.replace(old,new,1), encoding='utf-8')"

      - name: Commit assertion alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/foundation/test/eta-simulator.test.ts
          git commit -m "Align urban speed cap assertion"
          git push origin HEAD:agent/stage-16-confidence-data-quality
