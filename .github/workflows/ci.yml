name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-16-confidence-data-quality

      - name: Capture exact runner lines
        shell: bash
        run: |
          nl -ba packages/foundation/test/eta-simulator.test.ts | sed -n '312,334p' > stage16-test-lines.txt
          git rev-parse HEAD >> stage16-test-lines.txt

      - name: Upload runner line map
        uses: actions/upload-artifact@v4
        with:
          name: stage16-test-lines
          path: stage16-test-lines.txt
          if-no-files-found: error
          retention-days: 1
