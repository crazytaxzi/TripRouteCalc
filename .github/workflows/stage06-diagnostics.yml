name: Stage 06 final lint fix

on:
  push:
    branches:
      - agent/stage-06-hos-cycle-recaps-restart

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message != 'Resolve Stage 06 recap seed typing'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/stage-06-hos-cycle-recaps-restart
      - name: Replace assertion with explicit typed entries
        shell: python
        run: |
          from pathlib import Path

          source = Path('packages/foundation/src/hos-cycle.ts')
          text = source.read_text()
          old = """function reconcileRecaps(
            entered: readonly CycleRecapReturn[],
            derivedSeeds: readonly AvailabilitySeed[],
          ): HosRecapReconciliation {
            const mismatches: HosRecapMismatch[] = [];
            const enteredByDate = new Map(entered.map((value) => [recapKey(value), value]));
            const derivedByDate = new Map(
              derivedSeeds
                .filter((value) => value.kind === 'RECAP' && value.sourceDate !== undefined)
                .map((value) => [value.sourceDate!, value]),
            );
          """
          new = """function recapSeedEntries(
            seeds: readonly AvailabilitySeed[],
          ): readonly (readonly [string, AvailabilitySeed])[] {
            const entries: Array<readonly [string, AvailabilitySeed]> = [];
            for (const seed of seeds) {
              if (seed.kind === 'RECAP' && seed.sourceDate !== undefined) {
                entries.push([seed.sourceDate, seed]);
              }
            }
            return freeze(entries);
          }

          function reconcileRecaps(
            entered: readonly CycleRecapReturn[],
            derivedSeeds: readonly AvailabilitySeed[],
          ): HosRecapReconciliation {
            const mismatches: HosRecapMismatch[] = [];
            const enteredByDate = new Map(entered.map((value) => [recapKey(value), value]));
            const derivedByDate = new Map(recapSeedEntries(derivedSeeds));
          """
          if old not in text:
              raise SystemExit('Expected recap reconciliation block was not found.')
          source.write_text(text.replace(old, new))
      - name: Commit exact correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/foundation/src/hos-cycle.ts
          git commit -m "Resolve Stage 06 recap seed typing"
          git push origin HEAD:agent/stage-06-hos-cycle-recaps-restart
