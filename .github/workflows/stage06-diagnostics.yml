name: Stage 06 diagnostics

on:
  push:
    branches:
      - agent/stage-06-hos-cycle-recaps-restart

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          pnpm lint:source > stage06-lint.log 2>&1
          status=$?
          printf '%s\n' "$status" > stage06-lint.exit
          exit 0
      - name: Upload lint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: stage06-lint-diagnostics
          path: |
            stage06-lint.log
            stage06-lint.exit
          if-no-files-found: error
      - name: Post lint diagnostics to the draft pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('stage06-lint.log', 'utf8');
            const exitCode = fs.readFileSync('stage06-lint.exit', 'utf8').trim();
            const marker = '<!-- stage06-lint-diagnostics -->';
            const body = `${marker}\nTemporary Stage 06 lint diagnostics, exit code ${exitCode}:\n\n\`\`\`text\n${output.slice(-60000)}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 8,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 8,
                body,
              });
            }
