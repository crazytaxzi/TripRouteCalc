name: Stage 06 lint fix

on:
  push:
    branches:
      - agent/stage-06-hos-cycle-recaps-restart

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message != 'Fix Stage 06 lint findings'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/stage-06-hos-cycle-recaps-restart
      - name: Apply exact lint corrections
        shell: python
        run: |
          from pathlib import Path

          source = Path('packages/foundation/src/hos-cycle.ts')
          source_text = source.read_text()
          source_text = source_text.replace(
              '.map((value) => [value.sourceDate as string, value]),',
              '.map((value) => [value.sourceDate!, value]),',
          )
          source.write_text(source_text)

          tests = Path('packages/foundation/test/hos-cycle.test.ts')
          test_text = tests.read_text()
          test_text = test_text.replace(
              "  const departureAt = String(\n"
              "    overrides.departureAt ?? '2026-07-20T12:00:00.000Z',\n"
              "  );\n"
              "  const departureTimeZone = String(overrides.departureTimeZone ?? 'UTC');",
              "  const departureAt = typeof overrides.departureAt === 'string'\n"
              "    ? overrides.departureAt\n"
              "    : '2026-07-20T12:00:00.000Z';\n"
              "  const departureTimeZone = typeof overrides.departureTimeZone === 'string'\n"
              "    ? overrides.departureTimeZone\n"
              "    : 'UTC';",
          )
          tests.write_text(test_text)
      - name: Commit exact corrections
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/foundation/src/hos-cycle.ts packages/foundation/test/hos-cycle.test.ts
          git commit -m "Fix Stage 06 lint findings"
          git push origin HEAD:agent/stage-06-hos-cycle-recaps-restart
