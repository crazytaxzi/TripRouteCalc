name: Stage 06 restart fixture fix

on:
  push:
    branches:
      - agent/stage-06-hos-cycle-recaps-restart

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message != 'Fix Stage 06 restart boundary fixtures'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/stage-06-hos-cycle-recaps-restart
      - name: Remove unintended predeparture restart credit
        shell: python
        run: |
          from pathlib import Path

          tests = Path('packages/foundation/test/hos-cycle.test.ts')
          text = tests.read_text()
          old = """        startAt: '2026-07-19T00:00:00.000Z',
                  endAt: '2026-07-19T23:20:00.000Z',
          """
          new = """        startAt: '2026-07-19T12:40:00.000Z',
                  endAt: '2026-07-20T12:00:00.000Z',
          """
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected two restart fixture intervals, found {count}.')
          tests.write_text(text.replace(old, new))
      - name: Commit exact fixture correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/foundation/test/hos-cycle.test.ts
          git commit -m "Fix Stage 06 restart boundary fixtures"
          git push origin HEAD:agent/stage-06-hos-cycle-recaps-restart
