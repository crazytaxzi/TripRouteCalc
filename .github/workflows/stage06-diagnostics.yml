name: Stage 06 array style fix

on:
  push:
    branches:
      - agent/stage-06-hos-cycle-recaps-restart

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message != 'Fix Stage 06 array style'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/stage-06-hos-cycle-recaps-restart
      - name: Apply exact array style correction
        shell: python
        run: |
          from pathlib import Path

          source = Path('packages/foundation/src/hos-cycle.ts')
          text = source.read_text()
          old = '  const entries: Array<readonly [string, AvailabilitySeed]> = [];'
          new = '  const entries: (readonly [string, AvailabilitySeed])[] = [];'
          if old not in text:
              raise SystemExit('Expected array declaration was not found.')
          source.write_text(text.replace(old, new))
      - name: Commit exact correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/foundation/src/hos-cycle.ts
          git commit -m "Fix Stage 06 array style"
          git push origin HEAD:agent/stage-06-hos-cycle-recaps-restart
