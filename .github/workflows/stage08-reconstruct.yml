name: Stage 08 reconstruction

on:
  push:
    branches:
      - agent/stage-08-hos-automated-tests

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Stage 08 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-08-hos-automated-tests
      - name: Verify and extract Stage 08 payload
        shell: bash
        run: |
          base64 --decode .stage08-upload/stage08-files.tar.gz.b64 > stage08-files.tar.gz
          printf '%s  %s\n' \
            '701e84025b77daa442fdaddb8909aafbe70a69199d1b36b45f5e26161addc177' \
            'stage08-files.tar.gz' | sha256sum --check --strict
          tar -xzf stage08-files.tar.gz
          test -f packages/foundation/test/hos-test-fixtures.ts
          test -f packages/foundation/test/hos-acceptance.test.ts
          test -f packages/foundation/test/hos-engine-isolation.test.ts
          test -f packages/persistence/test/hos-domain-mapping.integration.test.ts
          test -f docs/hos/test-fixtures.md
      - name: Remove reconstruction scaffolding
        shell: bash
        run: |
          rm -rf .stage08-upload
          rm -f stage08-files.tar.gz
          rm -f .github/workflows/stage08-reconstruct.yml
      - name: Commit clean Stage 08 test suite
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Add Stage 08 HOS acceptance suite"
          git push origin HEAD:agent/stage-08-hos-automated-tests
