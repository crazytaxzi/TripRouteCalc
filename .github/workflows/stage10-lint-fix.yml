name: Stage 10 Lint Fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply exact lint corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/foundation/src/stops.ts')
          text = path.read_text()
          replacements = {
              'if (next === undefined || next.sequence !== stop.sequence) {':
                  'if (next?.sequence !== stop.sequence) {',
              "if (\n      leg === undefined ||\n      leg.fromStopId !== stop.id ||\n      leg.toStopId !== nextStop.id\n    ) {":
                  "if (\n      leg?.fromStopId !== stop.id ||\n      leg?.toStopId !== nextStop.id\n    ) {",
          }
          for before, after in replacements.items():
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'Expected one exact match, found {count}: {before!r}')
              text = text.replace(before, after)
          path.write_text(text)
          PY
          rm -f .github/workflows/stage10-lint-diagnostic.yml
          rm -f .github/workflows/stage10-lint-fix.yml

      - name: Commit lint corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Stage 10 lint findings"
          git push origin HEAD:agent/stage-10-stops-appointments-service
