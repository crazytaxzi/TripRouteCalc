name: Stage 07 reconstruction

on:
  push:
    branches:
      - agent/stage-07-hos-sleeper-adverse-policy

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Stage 07 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-07-hos-sleeper-adverse-policy
      - name: Reconstruct verified Stage 07 files and patch contracts
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json

          root = Path('.')

          def decode_payload(payload_path: str, target_path: str, expected_sha256: str) -> None:
              encoded = (root / payload_path).read_text().strip()
              content = gzip.decompress(base64.b64decode(encoded))
              actual = hashlib.sha256(content).hexdigest()
              if actual != expected_sha256:
                  raise SystemExit(
                      f'{payload_path} reconstructed SHA-256 {actual}, expected {expected_sha256}.'
                  )
              target = root / target_path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)

          decode_payload(
              '.stage07-upload/hos-advanced.ts.gz.b64',
              'packages/foundation/src/hos-advanced.ts',
              'ce6e40518a7cba345cfed61b3db9f4b7830ce904d439c431da242cc7524c4aae',
          )
          decode_payload(
              '.stage07-upload/hos-advanced.test.ts.gz.b64',
              'packages/foundation/test/hos-advanced.test.ts',
              '29af799371b160cc3c3e1f9b4cd7a190ecf114a3bbc8ce0c052227f55c11e1a9',
          )

          hos_path = root / 'packages/foundation/src/hos.ts'
          lines = hos_path.read_text().splitlines()

          legacy_guard = "if (sleeperPair.participates && dutyStatus !== 'SLEEPER_BERTH') {"
          guard_indexes = [
              index for index, line in enumerate(lines) if line.strip() == legacy_guard
          ]
          if len(guard_indexes) != 1:
              raise SystemExit(
                  f'Expected one legacy sleeper-only guard, found {len(guard_indexes)}.'
              )
          guard_index = guard_indexes[0]
          if guard_index + 2 >= len(lines) or lines[guard_index + 2].strip() != '}':
              raise SystemExit('Legacy sleeper-only guard did not have the expected three-line shape.')
          del lines[guard_index:guard_index + 3]

          participation = 'if (sleeperPair.participates) {'
          candidate = "const candidateRole = sleeperPair.candidateRole ?? 'SHORT_PERIOD';"
          insertion_indexes = [
              index
              for index, line in enumerate(lines)
              if line.strip() == candidate
              and index > 0
              and lines[index - 1].strip() == participation
          ]
          if len(insertion_indexes) != 1:
              raise SystemExit(
                  f'Expected one sleeper-pair candidate role, found {len(insertion_indexes)}.'
              )
          candidate_index = insertion_indexes[0]
          indent = lines[candidate_index][:len(lines[candidate_index]) - len(lines[candidate_index].lstrip())]
          inserted = [
              f"{indent}const statusQualifies = candidateRole === 'LONG_PERIOD'",
              f"{indent}  ? dutyStatus === 'SLEEPER_BERTH'",
              f"{indent}  : dutyStatus === 'OFF_DUTY' || dutyStatus === 'SLEEPER_BERTH';",
              f'{indent}if (!statusQualifies) {{',
              f"{indent}  issues.push({{ code: 'CONTRADICTORY_STATE', path: `${{path}}.sleeperPair`, message: 'A long paired period must be sleeper-berth time; a short paired period may be off-duty or sleeper-berth time.' }});",
              f'{indent}}}',
          ]
          lines[candidate_index + 1:candidate_index + 1] = inserted
          hos_path.write_text('\n'.join(lines) + '\n')

          package_path = root / 'packages/foundation/package.json'
          package = json.loads(package_path.read_text())
          exports = package.get('exports')
          if not isinstance(exports, dict):
              raise SystemExit('Foundation package exports map was not found.')
          exports['./hos-advanced'] = {
              'types': './dist/hos-advanced.d.ts',
              'import': './dist/hos-advanced.js',
          }
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          index_path = root / 'packages/foundation/src/index.ts'
          index = index_path.read_text()
          advanced_export = "export * from './hos-advanced.js';"
          if advanced_export not in index:
              cycle_export = "export * from './hos-cycle.js';"
              if cycle_export in index:
                  index = index.replace(cycle_export, cycle_export + '\n' + advanced_export)
              else:
                  index = index.rstrip() + '\n' + advanced_export + '\n'
              index_path.write_text(index)
      - name: Remove reconstruction scaffolding
        shell: bash
        run: |
          rm -rf .stage07-upload
          rm -f .github/workflows/stage07-reconstruct.yml
      - name: Commit clean Stage 07 implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Implement Stage 07 advanced HOS rules"
          git push origin HEAD:agent/stage-07-hos-sleeper-adverse-policy
