name: Stage 12 Test Diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/stage12-test-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trip_route_calc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_route_calc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-12-regulatory-rules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Capture test output
        run: |
          set +e
          pnpm install --frozen-lockfile > stage12-tests.txt 2>&1
          pnpm db:generate >> stage12-tests.txt 2>&1
          pnpm db:migrate:deploy >> stage12-tests.txt 2>&1
          pnpm test:source >> stage12-tests.txt 2>&1
          echo "exit_code=$?" >> stage12-tests.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-tests
          path: stage12-tests.txt
