name: Stage 17 lint repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-stage17-lint:
    if: github.head_ref == 'agent/stage-17-rest-api-validation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-17-rest-api-validation
          fetch-depth: 0
      - name: Apply bounded repair
        run: |
          echo '' | base64 --decode > /tmp/stage17_lint_repair.py
          python /tmp/stage17_lint_repair.py
      - name: Commit bounded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/src/application.ts packages/api/src/openapi.ts .github/workflows/stage17-lint-repair.yml .github/workflows/stage17-transport-lint.yml
          git commit -m 'Repair Stage 17 lint findings'
          git push origin HEAD:agent/stage-17-rest-api-validation
