name: Stage 14 Type Diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/stage14-type-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-14-operational-events
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Capture compiler output
        run: |
          set +e
          pnpm install --frozen-lockfile > stage14-type.txt 2>&1
          pnpm db:generate >> stage14-type.txt 2>&1
          pnpm typecheck:source >> stage14-type.txt 2>&1
          echo "exit_code=$?" >> stage14-type.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage14-type
          path: stage14-type.txt
