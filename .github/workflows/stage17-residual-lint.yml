name: Stage 17 residual lint repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-residual-lint:
    if: github.head_ref == 'agent/stage-17-rest-api-validation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-17-rest-api-validation
          fetch-depth: 0
      - name: Repair constructor callback annotation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/api/src/application.ts')
          text = path.read_text()
          old = "    this.#now = dependencies.now ?? (() => new Date());\n"
          new = "    this.#now = dependencies.now ?? ((): Date => new Date());\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected constructor fallback once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/stage17-residual-lint.yml').unlink()
          PY
      - name: Commit residual lint repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/src/application.ts .github/workflows/stage17-residual-lint.yml
          git commit -m 'Repair final Stage 17 lint finding'
          git push origin HEAD:agent/stage-17-rest-api-validation
