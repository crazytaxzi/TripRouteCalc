name: Stage 17 final typecheck diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test

jobs:
  diagnose-final-typecheck:
    if: github.head_ref == 'agent/stage-17-rest-api-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Capture typecheck
        id: check
        continue-on-error: true
        run: pnpm typecheck:source > stage17-final-typecheck.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: stage17-final-typecheck
          path: stage17-final-typecheck.log
          retention-days: 1
      - if: steps.check.outcome == 'failure'
        run: exit 1
