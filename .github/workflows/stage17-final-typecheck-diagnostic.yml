name: Stage 17 final typecheck repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-final-typecheck:
    if: github.head_ref == 'agent/stage-17-rest-api-validation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-17-rest-api-validation
          fetch-depth: 0
      - name: Apply bounded compiler repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/api/src/application.ts')
          text = path.read_text()
          replacements = [
              (
                  "  const routePayload = { ...route, legs };\n  delete routePayload.assessment;\n  const validatedRoute = assessCommercialRoute(routePayload);\n",
                  "  const routePayload = Object.fromEntries(\n    Object.entries(route).filter(([key]) => key !== 'assessment'),\n  );\n  const validatedRoute = assessCommercialRoute({ ...routePayload, legs });\n",
              ),
              (
                  "      inputSnapshot: draft,\n",
                  "      inputSnapshot: snapshotObject(draft),\n",
              ),
          ]
          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Replacement {index} expected once, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/stage17-final-typecheck-diagnostic.yml').unlink()
          PY
      - name: Commit final compiler repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/src/application.ts .github/workflows/stage17-final-typecheck-diagnostic.yml
          git commit -m 'Repair final Stage 17 typecheck findings'
          git push origin HEAD:agent/stage-17-rest-api-validation
