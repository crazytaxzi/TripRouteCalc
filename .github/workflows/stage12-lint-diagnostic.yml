name: Stage 12 Lint Diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/stage12-lint-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_route_calc_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-12-regulatory-rules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Capture lint output
        run: |
          set +e
          pnpm install --frozen-lockfile > stage12-lint.txt 2>&1
          pnpm db:generate >> stage12-lint.txt 2>&1
          pnpm lint:source >> stage12-lint.txt 2>&1
          echo "exit_code=$?" >> stage12-lint.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-lint-repaired
          path: stage12-lint.txt
