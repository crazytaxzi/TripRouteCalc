name: Stage 12 Repair Diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/stage12-lint-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-12-regulatory-rules
      - name: Extract repair script
        run: |
          python3 <<'PYEXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/stage12-optional-repair.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          lines = source[start:end].splitlines()
          Path('stage12-extracted-repair.py').write_text('\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n')
          PYEXTRACT
      - name: Capture repair result
        run: |
          set +e
          python3 stage12-extracted-repair.py > stage12-repair-trace.txt 2>&1
          echo "exit_code=$?" >> stage12-repair-trace.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-repair-diagnostic
          path: |
            stage12-extracted-repair.py
            stage12-repair-trace.txt
