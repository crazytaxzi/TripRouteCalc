name: Stage 12 Lint Repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/stage12-lint-diagnostic.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-12-regulatory-rules
          fetch-depth: 0
      - name: Repair public regulatory types
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/foundation/src/regulatory.ts')
          text = path.read_text()
          text = text.replace("  CommercialRouteSegment,\n", "", 1)
          text = text.replace(
              "export type RegulatoryRoadScope = Readonly<\n  z.infer<typeof RegulatoryRoadScopeSchema>\n>;",
              """export type RegulatoryRoadScope =
            | Readonly<{ kind: 'jurisdiction-wide'; jurisdictionCodes: readonly string[] }>
            | Readonly<{
                kind: 'road-identity';
                roadIdentities: readonly string[];
                directions: readonly RegulatoryDirection[];
              }>
            | Readonly<{ kind: 'segment'; segmentIds: readonly string[] }>
            | Readonly<{
                kind: 'geometry-bounds';
                west: number;
                east: number;
                south: number;
                north: number;
              }>;""",
              1,
          )
          text = text.replace(
              "export type JurisdictionRule = Readonly<z.infer<typeof JurisdictionRuleSchema>>;",
              """export interface JurisdictionRule {
            readonly ruleId: string;
            readonly jurisdictionCode: string;
            readonly category: RegulatoryRuleCategory;
            readonly affectedVehicleTypes: readonly RegulatoryVehicleType[];
            readonly roadScope: RegulatoryRoadScope;
            readonly effectiveFrom: UtcInstant;
            readonly effectiveTo?: UtcInstant;
            readonly source: RegulatorySource;
            readonly explanation: string;
            readonly condition: RegulatoryCondition;
            readonly requiredAction: RegulatoryRequiredAction;
            readonly severity: RegulatoryRuleSeverity;
            readonly blocksRouteFinalization: boolean;
            readonly requiresManualVerification: boolean;
            readonly active: boolean;
            readonly version: string;
          }""",
              1,
          )
          text = text.replace(
              "export type RegulatoryRuleSet = Readonly<z.infer<typeof RegulatoryRuleSetSchema>>;",
              """export interface RegulatoryRuleSet {
            readonly ruleSetId: string;
            readonly name: string;
            readonly version: string;
            readonly status: RegulatoryRuleSetStatus;
            readonly effectiveFrom: UtcInstant;
            readonly effectiveTo?: UtcInstant;
            readonly source: RegulatorySource;
            readonly coverage: RegulatoryCoverage;
            readonly rules: readonly JurisdictionRule[];
          }""",
              1,
          )
          path.write_text(text)
          PY
      - name: Add explicit test types
        run: |
          sed -i "/evaluateRegulatoryCompliance.*\.\.\/src\/index/d" packages/compliance/test/regulatory-fixtures.ts
          sed -i "s/export function equipment(kpraFeet = 40) {/export function equipment(kpraFeet = 40): RegulatoryEvaluationInput['equipment'] {/" packages/compliance/test/regulatory-fixtures.ts
          sed -i "/import { describe, expect, it } from 'vitest';/i import type { JurisdictionRule } from '..\/src\/index.js';" packages/foundation/test/regulatory.test.ts
          sed -i "s/function rule(ruleId = 'TEST-KPRA') {/function rule(ruleId = 'TEST-KPRA'): JurisdictionRule {/" packages/foundation/test/regulatory.test.ts
          sed -i "/} from '@trip-route-calc\/foundation';/a import type { JurisdictionRule, RegulatoryRuleSet } from '@trip-route-calc/foundation';" packages/persistence/test/regulatory-rule-workflow.integration.test.ts
          sed -i "s/function rule(ruleId: string, maximumFeet: number) {/function rule(ruleId: string, maximumFeet: number): JurisdictionRule {/" packages/persistence/test/regulatory-rule-workflow.integration.test.ts
          sed -i "s/function ruleSet(version: string, maximumFeet = 40) {/function ruleSet(version: string, maximumFeet = 40): RegulatoryRuleSet {/" packages/persistence/test/regulatory-rule-workflow.integration.test.ts
      - name: Commit lint repair
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages
          git commit -m 'Fix Stage 12 regulatory type boundaries'
          git push origin HEAD:agent/stage-12-regulatory-rules
