name: Stage 14 HOS Event Patch

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/stage14-hos-event-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-14-operational-events
          fetch-depth: 0
      - name: Add explicit operational duty event types
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('packages/foundation/src/hos.ts')
          text = path.read_text()
          old = """  'MAINTENANCE',
            'BORDER_OR_AGRICULTURAL_INSPECTION',
            'OTHER',"""
          new = """  'MAINTENANCE',
            'BORDER_OR_AGRICULTURAL_INSPECTION',
            'CARGO_SECUREMENT_CHECK',
            'REEFER_CHECK',
            'PARKING_SEARCH',
            'MEAL',
            'SHOWER',
            'OTHER',"""
          if text.count(old) != 1:
              raise RuntimeError('Expected one HOS event enum insertion point.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/foundation/src/hos.ts
          git commit -m 'Add Stage 14 HOS operational event types'
          git push origin HEAD:agent/stage-14-operational-events
